  }

  // ---------- schedule + trip record: one row in bf_plans is one schedule entry and, later, its record ----------
  let plansReady = true;   // false until 02_butterflight_plans.sql has been run on the server
  function planFromRow(d){
    return { id:d.id, ideaId:d.idea_id||'', title:d.title, day:d.day||'', time:d.at_time||'', place:d.place||'',
      sort:d.sort||0, status:d.status||'', spont:!!d.spontaneous, note:d.note||'',
      photoPath:d.photo_path||'', photo: photoLinks[d.photo_path] || '', ratio:d.photo_ratio||0, by:d.created_by, createdAt:ms(d.created_at) };
  }
  const dayList = r => { if(!r.start || !r.end) return []; const n = diff(r.start, r.end) + 1; return Array.from({ length:n }, (_, i) => addDays(r.start, i)); };
  const inTrip = (r, day) => !!day && !!r.start && day >= r.start && day <= r.end;
  const byTime = (a, b) => (a.time||'99:99').localeCompare(b.time||'99:99') || a.sort - b.sort || a.createdAt - b.createdAt;
  const dayTag = (r, day) => 'DAY '+(diff(r.start, day) + 1);
  const curRoom = () => rooms.find(x => x.id===view.id);
  const keepScroll = () => { const sc0 = document.getElementById('cv-scroll'); if(sc0) pendingScroll = { left: sc0.scrollLeft, top: sc0.scrollTop }; };

  function setupNote(){
    return '<div class="empty"><strong>일정 표가 아직 서버에 없어요</strong><span>Supabase SQL Editor에서 02_butterflight_plans.sql 을 한 번 실행하면 바로 쓸 수 있어요.</span></div>';
  }
  function noDates(r, what){
    return '<div class="empty"><strong>아직 여행 날짜가 없어요</strong><span>'+what+'</span>'
      + (isOwner(r) ? '<button type="button" class="btn small" data-act="edit-room">날짜 정하기</button>' : '') + '</div>';
  }
  const timeChip = p => '<span class="pl-time'+(p.time?'':' none')+'">'+(p.time || '시간 미정')+'</span>';

  // ----- 일정 tab -----
  function planPanel(r){
    if(!plansReady) return setupNote();
    const days = dayList(r), planned = r.plans.filter(p => !p.spont);
    let h = '<div class="pl-head"><h2>일정</h2><p>'+whenText(r)+'</p></div>';
    if(!days.length) h += noDates(r, '날짜를 정하면 날짜별 칸이 생겨요. 그전에는 ‘날짜 미정’ 칸에 먼저 담아 둘 수 있어요.');
    const row = p => {
      const idea = p.ideaId && r.ideas.find(i => i.id===p.ideaId);
      const off = p.day && !inTrip(r, p.day) ? '<small class="pl-off">'+fmt(p.day)+' · 여행 날짜 밖</small>' : '';
      return '<li><button type="button" class="pl-item" data-act="plan-edit" data-id="'+p.id+'">' + timeChip(p)
        + '<span class="pl-main"><b>'+esc(p.title)+'</b>'+(p.place ? '<small>'+PIN+esc(p.place)+'</small>' : '')+off+'</span>'
        + (idea ? '<span class="pl-kind">'+KINDS[idea.kind]+'</span>' : '') + '</button></li>';
    };
    const section = (day, label, sub, items, loose) => '<section class="pl-day'+(loose?' loose':'')+'"><header><b>'+label+'</b><span>'+sub+'</span>'
      + '<button type="button" class="btn small" data-act="plan-pick" data-day="'+day+'" aria-label="'+label+'에 일정 넣기">+ 넣기</button></header>'
      + (items.length ? '<ol class="pl-list">'+items.map(row).join('')+'</ol>' : '<p class="pl-none">'+(loose ? '날짜를 아직 못 정한 일정은 여기에 둬요' : '아직 비어 있어요')+'</p>')
      + '</section>';
    days.forEach(day => { h += section(day, dayTag(r, day), fmt(day), planned.filter(p => p.day===day).sort(byTime)); });
    h += section('', '날짜 미정', '', planned.filter(p => !inTrip(r, p.day)).sort(byTime), true);
    return h;
  }

  // ----- 여행 기록 tab -----
  function tally(r){
    const planned = r.plans.filter(p => !p.spont);
    return { plan: planned.length, done: planned.filter(p => p.status==='done').length, skip: planned.filter(p => p.status==='skip').length,
             spont: r.plans.filter(p => p.spont).length };
  }
  function recordPanel(r){
    if(!plansReady) return setupNote();
    const days = dayList(r);
    let h = '<div class="pl-head"><h2>여행 기록</h2>'
      + '<div class="rmode" role="group" aria-label="보는 방법"><button type="button" data-act="rmode" data-mode="check" aria-pressed="'+(view.rmode!=='compare')+'">체크하기</button>'
      + '<button type="button" data-act="rmode" data-mode="compare" aria-pressed="'+(view.rmode==='compare')+'">계획과 실제</button></div></div>';
    if(!days.length) return h + noDates(r, '날짜를 정하면 날마다 했어요·못 했어요를 체크하고, 사진과 감상을 남길 수 있어요.');
    const t = tally(r);
    h += '<p class="rc-sum">계획 '+t.plan+'개 중 <b class="ok">했어요 '+t.done+'</b> · <b class="no">못 했어요 '+t.skip+'</b> · <b class="sp">즉흥 '+t.spont+'</b></p>';
    if(status(r)==='plan') h += '<p class="pl-none">여행이 시작되면 여기서 하나씩 체크해 보세요. 미리 둘러봐도 괜찮아요.</p>';
    if(view.rmode==='compare') return h + comparePanel(r, days);

    const row = p => {
      const thumb = p.photo ? '<img class="rc-thumb" src="'+esc(p.photo)+'" alt="">' : '';
      return '<li class="rc '+(p.status||'none')+(p.spont?' spont':'')+'">'
        + '<button type="button" class="pl-item rc-main" data-act="rec-edit" data-id="'+p.id+'" aria-label="'+esc(p.title)+' 기록 남기기">' + timeChip(p)
        +   '<span class="pl-main"><b>'+esc(p.title)+'</b>'+(p.note ? '<span class="rc-note">'+esc(p.note)+'</span>' : (p.place ? '<small>'+PIN+esc(p.place)+'</small>' : ''))+'</span>'+thumb+'</button>'
        + (p.spont ? '<span class="rc-tag">즉흥</span>'
          : '<span class="rc-checks" role="group" aria-label="'+esc(p.title)+'">'
            + '<button type="button" class="done" data-act="rec-mark" data-id="'+p.id+'" data-st="done" aria-pressed="'+(p.status==='done')+'">했어요</button>'
            + '<button type="button" class="skip" data-act="rec-mark" data-id="'+p.id+'" data-st="skip" aria-pressed="'+(p.status==='skip')+'">못 했어요</button></span>')
        + '</li>';
    };
    days.forEach(day => {
      const items = r.plans.filter(p => p.day===day).sort(byTime);
      h += '<section class="pl-day"><header><b>'+dayTag(r, day)+'</b><span>'+fmt(day)+'</span></header>'
        + (items.length ? '<ol class="pl-list">'+items.map(row).join('')+'</ol>' : '<p class="pl-none">이날 넣어 둔 일정이 없어요</p>')
        + '<button type="button" class="rc-add" data-act="rec-spont" data-day="'+day+'">+ 계획에 없던 일 기록하기</button></section>';
    });
    const loose = r.plans.filter(p => !p.spont && !inTrip(r, p.day)).sort(byTime);
    if(loose.length) h += '<section class="pl-day loose"><header><b>날짜 미정</b><span>일정에서 날짜를 정하지 않은 것</span></header><ol class="pl-list">'+loose.map(row).join('')+'</ol></section>';
    return h;
  }
  function comparePanel(r, days){
    const mark = p => '<i class="mk '+(p.status||'none')+'" aria-label="'+(p.status==='done'?'했어요':p.status==='skip'?'못 했어요':'아직')+'">'+(p.status==='done'?'✓':p.status==='skip'?'✕':'')+'</i>';
    const planLi = p => '<li>'+mark(p)+'<span>'+esc(p.title)+(p.status==='skip' && p.note ? '<small>'+esc(p.note)+'</small>' : '')+'</span></li>';
    const realLi = p => '<li class="'+(p.spont?'sp':'')+'"><span>'+(p.spont?'<em>즉흥</em> ':'')+esc(p.title)+(p.note ? '<small>'+esc(p.note)+'</small>' : '')+'</span>'
      + (p.photo ? '<img src="'+esc(p.photo)+'" alt="'+esc(p.title)+' 사진">' : '') + '</li>';
    const block = (label, sub, planned, real) => '<section class="cmp-day"><header><b>'+label+'</b><span>'+sub+'</span></header><div class="cmp-cols">'
      + '<div class="cmp-col"><h4>계획</h4>'+(planned.length ? '<ul>'+planned.map(planLi).join('')+'</ul>' : '<p class="pl-none">계획 없음</p>')+'</div>'
      + '<div class="cmp-col real"><h4>실제</h4>'+(real.length ? '<ul>'+real.map(realLi).join('')+'</ul>' : '<p class="pl-none">아직 기록 없음</p>')+'</div>'
      + '</div></section>';
    let h = '';
    days.forEach(day => {
      const all = r.plans.filter(p => p.day===day).sort(byTime);
      h += block(dayTag(r, day), fmt(day), all.filter(p => !p.spont), all.filter(p => p.status==='done'));
    });
    const loose = r.plans.filter(p => !p.spont && !inTrip(r, p.day)).sort(byTime);
    if(loose.length) h += block('날짜 미정', '', loose, loose.filter(p => p.status==='done'));
    return h;
  }

  // ----- sheet modals (pick ideas / edit an entry / write a record) -----
  let pm = null;   // { type, id, day, ideaId, photo, photoPath, blob, ratio, busy, confirmDel }
  function openPM(state, title, formHtml, onSubmit){
    closeDetail(false);
    pm = Object.assign({ busy:false, confirmDel:false, opener: document.activeElement }, state);
    const wrap = document.createElement('div');
    wrap.className = 'scrim'; wrap.id = 'scrim';
    wrap.innerHTML = '<div class="memo" role="dialog" aria-modal="true" aria-labelledby="m-title"><span class="tape memo-tape" aria-hidden="true" style="--tape-tilt:-2deg"></span><div class="modal">'
      + '<div class="modal-head"><h2 id="m-title">'+title+'</h2><button type="button" class="x" data-act="close-pm" aria-label="닫기">×</button></div>'
      + '<form id="pm-form" novalidate>'+formHtml+'<p class="form-err" id="form-err" hidden></p><div class="actions" id="m-actions"></div></form></div></div>';
    document.body.appendChild(wrap);
    document.body.style.overflow = 'hidden';
    wrap.addEventListener('mousedown', e => { if(e.target===wrap) closePM(); });
    document.getElementById('pm-form').addEventListener('submit', e => { e.preventDefault(); if(pm && !pm.busy) onSubmit(); });
    renderPMActions();
    if(document.getElementById('photo-slot')) renderPhotoSlot();
    const first = wrap.querySelector('input:not([type=hidden]):not([type=checkbox]):not([type=radio]),select,textarea');
    (first || wrap.querySelector('.x')).focus();
  }
  function closePM(force){
    if(!pm || (pm.busy && !force)) return;
    const w = document.getElementById('scrim'); if(w) w.remove();
    document.body.style.overflow = '';
    const o = pm.opener; pm = null;
    if(o && document.body.contains(o)) o.focus();
  }
  function renderPMActions(){
    const a = document.getElementById('m-actions'); if(!a || !pm) return;
    const delWords = { item:['일정에서 빼기','이 일정을 뺄까요? 남긴 기록도 같이 지워져요.'], rec:['기록 지우기','이 즉흥 기록을 지울까요? 되돌릴 수 없어요.'] };
    const canDel = pm.id && (pm.type==='item' || (pm.type==='rec' && pm.spont));
    if(pm.confirmDel){
      a.innerHTML = '<div class="confirm"><p>'+delWords[pm.type][1]+'</p><button type="button" class="btn" data-act="pm-keep">취소</button><button type="button" class="btn danger" data-act="pm-del">지우기</button></div>';
      return;
    }
    const save = pm.saveLabel!==undefined ? pm.saveLabel : pm.type==='pick' ? '일정에 넣기' : pm.type==='item' && !pm.id ? '일정에 넣기' : '저장';
    a.innerHTML = (canDel ? '<button type="button" class="btn ghost-danger" data-act="pm-ask-del">'+delWords[pm.type][0]+'</button>' : '')
      + '<div class="right"><button type="button" class="btn" data-act="close-pm">'+(pm.cancelLabel||'취소')+'</button>'+(save ? '<button type="submit" class="btn primary">'+save+'</button>' : '')+'</div>';
  }
  const dayOptions = (r, cur) => {
    const opts = dayList(r).map(d => '<option value="'+d+'"'+(d===cur?' selected':'')+'>'+dayTag(r, d)+' · '+fmt(d)+'</option>');
    if(cur && !inTrip(r, cur)) opts.push('<option value="'+cur+'" selected>'+fmt(cur)+' (여행 날짜 밖)</option>');
    return '<option value=""'+(!cur?' selected':'')+'>날짜 미정</option>' + opts.join('');
  };

  // pick ideas (and/or write one) into a day
  function openPick(day){
    const r = curRoom(); if(!r) return;
    const label = day ? dayTag(r, day)+' · '+fmt(day) : '날짜 미정';
    const where = {}; r.plans.forEach(p => { if(p.ideaId && !p.spont) (where[p.ideaId] = where[p.ideaId] || []).push(p.day && inTrip(r, p.day) ? dayTag(r, p.day) : '미정'); });
    const ideas = r.ideas.slice().sort((a,b) => IMP_RANK[a.imp]-IMP_RANK[b.imp] || b.createdAt-a.createdAt);
    const list = ideas.length
      ? '<ul class="pk-list">'+ideas.map(i => '<li><label class="pk"><input type="checkbox" name="pk" value="'+i.id+'">'
          + '<span class="pk-t"><span class="pk-k">'+KINDS[i.kind]+' · '+IMP[i.imp]+'</span><b>'+esc(i.title)+'</b></span>'
          + (where[i.id] ? '<small>이미 '+where[i.id].join(', ')+'</small>' : '') + '</label></li>').join('')+'</ul>'
      : '<p class="pk-empty">아직 모은 아이디어가 없어요. 아래에 직접 적어도 돼요.</p>';
    openPM({ type:'pick', day }, esc(label)+'에 넣기',
      '<fieldset class="field"><legend>모은 아이디어에서 고르기</legend>'+list+'</fieldset>'
      + '<div class="field"><label for="p-free">직접 적기 <span class="opt">(선택)</span></label><input type="text" id="p-free" maxlength="50" placeholder="예: 공항에서 숙소로 이동" autocomplete="off"></div>',
      savePick);
    document.getElementById('pm-form').addEventListener('input', () => formErr(''));
  }
  async function savePick(){
    const r = curRoom(); if(!r) return;
    const day = pm.day || null;
    const picked = [...document.querySelectorAll('input[name=pk]:checked')].map(c => r.ideas.find(i => i.id===c.value)).filter(Boolean);
    const free = document.getElementById('p-free').value.trim();
    if(!picked.length && !free){ formErr('넣을 아이디어를 고르거나, 직접 적어 주세요.'); return; }
    let sort = r.plans.filter(p => (p.day||null)===day).reduce((m,p) => Math.max(m, p.sort), 0);
    const rows = picked.map(i => ({ room_id:r.id, idea_id:i.id, title:i.title, place:i.place||'', day, sort: ++sort }));
    if(free) rows.push({ room_id:r.id, title:free, day, sort: ++sort });
    formErr(''); setBusy(true, '넣는 중…');
    const { data, error } = await sb.from('bf_plans').insert(rows).select();
    if(error || !data){ setBusy(false); formErr('일정에 넣지 못했어요. '+errText(error)); return; }
    data.forEach(d => r.plans.push(planFromRow(d)));
    r.updatedAt = Date.now();
    pm.busy = false; closePM(); keepScroll(); render();
    toast(rows.length+'개를 일정에 넣었어요.');
  }

  // one schedule entry: new (from an idea's detail view) or existing
  function openPlanItem(id, ideaId){
    const r = curRoom(); if(!r) return;
    const p = id ? r.plans.find(x => x.id===id) : null;
    if(id && !p) return;
    const idea = r.ideas.find(i => i.id===(p ? p.ideaId : ideaId));
    const v = p || { title: idea ? idea.title : '', day:'', time:'', place: idea ? idea.place : '' };
    openPM({ type:'item', id: p ? p.id : null, ideaId: p ? p.ideaId : (ideaId||'') }, p ? '일정 고치기' : '일정에 넣기',
      '<div class="field"><label for="p-title">일정 이름</label><input type="text" id="p-title" maxlength="50" autocomplete="off" value="'+esc(v.title)+'"><p class="err" id="e-p-title" hidden></p></div>'
      + '<div class="row2"><div class="field"><label for="p-day">날짜</label><select id="p-day">'+dayOptions(r, v.day)+'</select></div>'
      + '<div class="field"><label for="p-time">시간 <span class="opt">(선택)</span></label><input type="time" id="p-time" value="'+esc(v.time)+'"></div></div>'
      + '<div class="field"><label for="p-place">장소 <span class="opt">(선택)</span></label><input type="text" id="p-place" maxlength="60" autocomplete="off" value="'+esc(v.place)+'"></div>'
      + (idea ? '<p class="pm-link"><button type="button" data-act="plan-idea" data-id="'+idea.id+'">원래 아이디어 보기 →</button></p>' : ''),
      savePlanItem);
  }
  async function savePlanItem(){
    const r = curRoom(); if(!r) return;
    const title = document.getElementById('p-title').value.trim();
    setErr('p-title', title ? '' : '일정 이름을 적어 주세요.');
    if(!title){ document.getElementById('p-title').focus(); return; }
    const day = document.getElementById('p-day').value || null;
    const time = (document.getElementById('p-time').value || '').slice(0,5) || null;
    const place = document.getElementById('p-place').value.trim();
    const row = { title, day, at_time: time, place };
    formErr(''); setBusy(true, '저장 중…');
    let res;
    if(pm.id){
      res = await sb.from('bf_plans').update(row).eq('id', pm.id).select().single();
    } else {
      const sort = r.plans.filter(p => (p.day||null)===day).reduce((m,p) => Math.max(m, p.sort), 0) + 1;
      res = await sb.from('bf_plans').insert(Object.assign(row, { room_id:r.id, idea_id: pm.ideaId || null, sort })).select().single();
    }
    if(res.error || !res.data){ setBusy(false); formErr('저장하지 못했어요. '+errText(res.error)); return; }
    const saved = planFromRow(res.data), i = r.plans.findIndex(p => p.id===saved.id);
    if(i >= 0){ saved.photo = r.plans[i].photo; r.plans[i] = saved; } else r.plans.push(saved);
    r.updatedAt = Date.now();
    const wasNew = !pm.id;
    pm.busy = false; closePM(); keepScroll(); render();
    toast(wasNew ? (day && inTrip(r, day) ? dayTag(r, day)+' 일정에 넣었어요.' : '‘날짜 미정’ 일정에 넣었어요.') : '일정을 고쳤어요.');
  }

  // a record: check, photo and a few words for a planned entry, or a spontaneous one
  function openRecord(id, day){
    const r = curRoom(); if(!r) return;
    const p = id ? r.plans.find(x => x.id===id) : null;
    if(id && !p) return;
    const spont = p ? p.spont : true;
    const st = p ? p.status : 'done';
    let f = '';
    if(spont){
      f += '<div class="field"><label for="p-title">무엇을 했나요?</label><input type="text" id="p-title" maxlength="50" placeholder="예: 골목에서 우연히 찾은 카페" autocomplete="off" value="'+esc(p ? p.title : '')+'"><p class="err" id="e-p-title" hidden></p></div>'
        +  '<div class="field"><label for="p-place">장소 <span class="opt">(선택)</span></label><input type="text" id="p-place" maxlength="60" autocomplete="off" value="'+esc(p ? p.place : '')+'"></div>';
    } else {
      f += '<p class="pm-plan">'+timeChip(p)+(p.place ? ' <span>'+PIN+esc(p.place)+'</span>' : '')+'</p>'
        +  '<fieldset class="field"><legend>어떻게 됐나요?</legend><div class="seg imps" style="--cols:3">'
        +  [['done','했어요'],['skip','못 했어요'],['','아직']].map(([k,l]) => '<label class="pick-'+(k||'none')+'"><input type="radio" name="p-st" value="'+k+'"'+(k===st?' checked':'')+'><span class="body"><b>'+l+'</b></span></label>').join('')
        +  '</div></fieldset>';
    }
    f += '<div class="field"><span class="field-title">사진 <span class="opt">(선택)</span></span><div id="photo-slot"></div><p class="err" id="e-i-photo" hidden></p></div>'
      +  '<div class="field"><label for="p-note" id="p-note-l">'+noteLabel(st)+' <span class="opt">(선택)</span></label><textarea id="p-note" maxlength="300" placeholder="'+notePh(st)+'">'+esc(p ? p.note : '')+'</textarea></div>';
    openPM({ type:'rec', id: p ? p.id : null, spont, day: p ? p.day : day, photo: p ? p.photo : '', photoPath: p ? p.photoPath : '', origPath: p ? p.photoPath : '', blob:null, ratio: p ? p.ratio : 0 },
      spont ? (p ? '즉흥 기록' : '계획에 없던 일 기록하기') : esc(p.title), f, saveRecord);
    document.querySelectorAll('input[name=p-st]').forEach(x => x.addEventListener('change', () => {
      document.getElementById('p-note-l').innerHTML = noteLabel(x.value)+' <span class="opt">(선택)</span>';
      document.getElementById('p-note').placeholder = notePh(x.value);
    }));
  }
  const noteLabel = st => st==='skip' ? '왜 못 했나요?' : '어땠나요?';
  const notePh = st => st==='skip' ? '예: 비가 와서 다음으로 미뤘어요' : '예: 줄이 길었지만 기다린 보람이 있었어요';
  async function saveRecord(){
    const r = curRoom(); if(!r) return;
    const m = pm;
    const note = document.getElementById('p-note').value.trim();
    const row = { note };
    if(m.spont){
      const title = document.getElementById('p-title').value.trim();
      setErr('p-title', title ? '' : '무엇을 했는지 적어 주세요.');
      if(!title){ document.getElementById('p-title').focus(); return; }
      Object.assign(row, { title, place: document.getElementById('p-place').value.trim() });
    } else {
      row.status = (document.querySelector('input[name=p-st]:checked') || {}).value || null;
    }
    if(m.blob && !m.origPath && photoCount(r, m.id) >= PHOTO_CAP){ formErr(errText('photo limit')); return; }
    formErr(''); setBusy(true, m.blob ? '사진 올리는 중…' : '저장 중…');
    let newPath = '';
    if(m.blob){
      try{ newPath = await uploadPhoto(r.id, m.blob); }
      catch(err){ setBusy(false); formErr('사진을 올리지 못했어요. '+errText(err)); return; }
    }
    const hasPhoto = !!(newPath || m.photoPath);
    Object.assign(row, { photo_path: newPath || m.photoPath || null, photo_ratio: hasPhoto ? m.ratio : null });
    const res = m.id
      ? await sb.from('bf_plans').update(row).eq('id', m.id).select().single()
      : await sb.from('bf_plans').insert(Object.assign(row, { room_id:r.id, day:m.day||null, spontaneous:true, status:'done' })).select().single();
    if(res.error || !res.data){ dropUpload(newPath); setBusy(false); formErr('저장하지 못했어요. '+errText(res.error)); return; }
    if(m.origPath && m.origPath!==(newPath || m.photoPath)) removePhotos([m.origPath]);
    const saved = planFromRow(res.data); saved.photo = hasPhoto ? m.photo : '';
    const i = r.plans.findIndex(p => p.id===saved.id); if(i >= 0) r.plans[i] = saved; else r.plans.push(saved);
    r.updatedAt = Date.now();
    m.busy = false; closePM(); keepScroll(); render();
    toast(m.id ? '기록을 저장했어요.' : '즉흥 기록을 남겼어요.');
  }

  // quick 했어요 / 못 했어요 straight from the list (tap again to undo)
  async function markPlan(id, st){
    const r = curRoom(), p = r && r.plans.find(x => x.id===id); if(!p) return;
    const before = p.status, next = p.status===st ? '' : st;
    p.status = next; keepScroll(); render();
    const { error } = await sb.from('bf_plans').update({ status: next || null }).eq('id', id);
    if(error){ p.status = before; keepScroll(); render(); toast('체크를 저장하지 못했어요. '+errText(error)); }
  }

  async function deletePM(){
    const r = curRoom(); if(!r || !pm || !pm.id) return;
    setBusy(true, '지우는 중…');
    const { error } = await sb.from('bf_plans').delete().eq('id', pm.id);
    if(error){ setBusy(false); pm.confirmDel = false; renderPMActions(); formErr('지우지 못했어요. '+errText(error)); return; }
    const type = pm.type, gone = r.plans.find(p => p.id===pm.id);
    if(gone) removePhotos([gone.photoPath]);
    r.plans = r.plans.filter(p => p.id!==pm.id); r.updatedAt = Date.now();
    pm.busy = false; closePM(); keepScroll(); render();
    toast(type==='item' ? '일정에서 뺐어요.' : '기록을 지웠어요.');
  }

  // ---------- add / edit modal ----------
  let modal = null; // { mode, id, photo, ratio, confirmDel, opener, fromDetail }
  function openModal(mode, id, opts){
    opts = opts || {};
    const r = rooms.find(x => x.id===view.id); if(!r) return;
    const it = mode==='edit' ? r.ideas.find(i => i.id===id) : null;
    if(mode==='edit' && !it) return;
    modal = { mode, id, photo: it ? (it.photo||'') : '', photoPath: it ? (it.photoPath||'') : '', origPath: it ? (it.photoPath||'') : '', blob:null, ratio: it ? (it.ratio||0) : 0,
              confirmDel:false, busy:false, opener: document.activeElement, fromDetail: !!opts.fromDetail };
    const v = (k, dflt) => it ? (it[k]||'') : (dflt||'');
    const kind = it ? it.kind : (view.kind!=='all' ? view.kind : 'place');
    const imp = it ? it.imp : 'nice';
    const wrap = document.createElement('div');

  // shrink the photo before storing it: longest side 720px, JPEG (about 50-120KB)
  function readPhoto(file){
    return new Promise((resolve, reject) => {
      if(!/^image\//.test(file.type||'')) return reject(new Error('type'));
      const url = URL.createObjectURL(file), img = new Image();
      img.onload = () => {
        const w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, 720 / Math.max(w, h));
        const c = document.createElement('canvas'); c.width = Math.round(w*k); c.height = Math.round(h*k);
        const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        const src = c.toDataURL('image/jpeg', 0.78);
        c.toBlob(blob => blob ? resolve({ src, blob, ratio: w / h }) : reject(new Error('blob')), 'image/jpeg', 0.78);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('load')); };
      img.src = url;
    });
  }

  async function onSaveIdea(ev){
    ev.preventDefault();

    const title = document.getElementById('i-title').value.trim();
    const memo = document.getElementById('i-memo').value.trim();

    let link = document.getElementById('i-link').value.trim();
    const kind = (document.querySelector('input[name="i-kind"]:checked')||{}).value || 'place';
    const imp = (document.querySelector('input[name="i-imp"]:checked')||{}).value || 'nice';
    if(link && !/^https?:\/\//i.test(link)) link = 'https://'+link;
    const errs = {
      'i-title': title ? '' : '아이디어 제목을 적어 주세요.',
      'i-link': (link && !/^https?:\/\/[^\s.]+\.[^\s]+$/i.test(link)) ? '링크 주소가 맞는지 확인해 주세요.' : ''
    };
    let first = null;
    Object.keys(errs).forEach(k => { setErr(k, errs[k]); if(errs[k] && !first) first = k; });
    if(first){ document.getElementById(first).focus(); return; }

    if(modal.blob && !modal.origPath && photoCount(r, modal.id) >= PHOTO_CAP){ formErr(errText('photo limit')); return; }
    formErr('');
    setBusy(true, modal.blob ? '사진 올리는 중…' : '저장 중…');
    const m = modal;
    // 1) a newly picked photo goes to the photo folder first; the card only keeps where it is
    let newPath = '';
    if(m.blob){
      try{ newPath = await uploadPhoto(r.id, m.blob); }
      catch(err){ if(modal===m){ setBusy(false); formErr('사진을 올리지 못했어요. '+errText(err)); } return; }
      if(modal===m) setBusy(true, '저장 중…');
    }
    const hasPhoto = !!(newPath || m.photoPath);
    const template = (document.querySelector('input[name="i-tpl"]:checked')||{}).value || 'polaroid';
    const row = { kind, title, memo, place, link, imp, photo_path: newPath || m.photoPath || null, photo_ratio: hasPhoto ? m.ratio : null };
    if(templatesReady) row.template = template;
    // 2) then the card itself
    let res;
    if(m.mode==='edit'){
      res = await sb.from('bf_ideas').update(row).eq('id', m.id).select().single();
    } else {
      const spot = freeSpot();
      Object.assign(row, { room_id: r.id, x: spot.x, y: spot.y, z: maxZ(r) + 1 });
      res = await sb.from('bf_ideas').insert(row).select().single();
    }
    if(res.error && row.template && /template/i.test(res.error.message||'')){
      // 04 SQL not run yet: keep the card, just without its shape
      templatesReady = false; delete row.template;
      res = m.mode==='edit' ? await sb.from('bf_ideas').update(row).eq('id', m.id).select().single() : await sb.from('bf_ideas').insert(row).select().single();
      if(!res.error) m.tplNote = ' (카드 모양은 04번 SQL을 실행한 뒤부터 저장돼요)';
    }
    if(res.error || !res.data){
      dropUpload(newPath);
      if(modal===m){ setBusy(false); formErr('저장하지 못했어요. '+errText(res.error)); }
      return;
    }
    if(m.origPath && m.origPath!==(newPath || m.photoPath)) removePhotos([m.origPath]);   // the old photo was replaced or taken out
    const saved = ideaFromRow(res.data);
    saved.photo = hasPhoto ? m.photo : '';   // show the photo already on screen, no need to ask for a new link
    if(m.mode==='edit'){ const old = r.ideas.find(x => x.id===m.id); if(old){ saved.likes = old.likes; saved.comments = old.comments; } }
    if(m.mode==='edit'){
      const i = r.ideas.findIndex(x => x.id===m.id);

    } else {
      r.ideas.push(saved);
    }
    r.updatedAt = Date.now();
    m.busy = false;
    if(modal!==m){ render(); return; }
    const wasEdit = m.mode==='edit', fromDetail = m.fromDetail, savedId = saved.id;

  }

  async function onJoin(ev){
    ev.preventDefault();
    const btn = ev.target.querySelector('button[type=submit]'); if(btn.disabled) return;
    const code = document.getElementById('j-code').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    const nick = document.getElementById('j-nick').value.trim();
    const errs = { 'j-code': code.length===6 ? '' : '초대 코드 6자리를 넣어 주세요.', 'j-nick': nick ? '' : '이 방에서 쓸 이름을 적어 주세요.' };
    let first = null;
    Object.keys(errs).forEach(k => { setErr(k, errs[k]); if(errs[k] && !first) first = k; });
    if(first){ document.getElementById(first).focus(); return; }
    btn.disabled = true; const label = btn.textContent; btn.textContent = '들어가는 중…';
    const { data, error } = await sb.rpc('bf_join_room', { p_code: code, p_nickname: nick });
    if(error || !data){ btn.disabled = false; btn.textContent = label; formErr(joinErr(error)); return; }
    setPendingJoin('');
    await refreshRooms();
    const r = rooms.find(x => x.id===data);
    homeRoomId = data;
    view = r ? { name:'room', id:data, tab:'ideas', kind:'all' } : { name:'home' };
    render();
    toast(r ? '‘'+r.dest+'’ 방에 들어왔어요. 같이 아이디어를 붙여 봐요!' : '방에 들어왔어요.');
  }

  async function saveNick(){
    const r = curRoom(); if(!r) return;
    const el = document.getElementById('p-nick'); if(!el) return;
    const nick = el.value.trim();
    setErr('p-nick', nick ? '' : '이름을 적어 주세요.'); if(!nick){ el.focus(); return; }
    const mine = (r.members||[]).find(m => m.uid===me());
    if(mine && mine.nick===nick){ closePM(); return; }
    setBusy(true, '저장 중…');
    const { error } = await sb.rpc('bf_set_nickname', { p_room: r.id, p_nickname: nick });
    if(error){ setBusy(false); formErr('이름을 바꾸지 못했어요. '+joinErr(error)); return; }

    pm.busy = false; closePM(); toast('이 방에서 내 이름을 ‘'+nick+'’(으)로 바꿨어요.');

  async function kickMember(uid, sure){
    const r = curRoom(); if(!r || !pm) return;

    if(error){ formErr('내보내지 못했어요. '+errText(error)); return; }
    const who = nickOf(r, uid);
    r.members = r.members.filter(m => m.uid!==uid);

  // ----- likes & comments (shown in the idea's detail view) -----

          + (c.uid===me() || isOwner(r) ? '<button type="button" class="linkish" data-act="del-comment" data-id="'+c.id+'" aria-label="댓글 지우기">지우기</button>' : '') + '</li>').join('')+'</ul>' : '')

  const shortWhen = ts => { const d = new Date(ts), now = new Date(); return (d.toDateString()===now.toDateString()) ? pad(d.getHours())+':'+pad(d.getMinutes()) : (d.getMonth()+1)+'.'+d.getDate(); };

    const r = curRoom(), it = r && detail && r.ideas.find(i => i.id===detail.id); if(!it) return;

  async function onComment(ev){
    ev.preventDefault();
    const r = curRoom(), it = r && detail && r.ideas.find(i => i.id===detail.id); if(!it) return;
    const t = document.getElementById('cm-body'), body = t.value.trim(); if(!body || t.disabled) return;

    const { data, error } = await sb.from('bf_comments').insert({ idea_id: it.id, body }).select().single();

    if(error || !data){ toast('댓글을 남기지 못했어요. '+errText(error)); t.focus(); return; }

    t.value = ''; renderSocial(); document.getElementById('cm-body').focus();
  }
  async function deleteComment(id){
    const r = curRoom(), it = r && detail && r.ideas.find(i => i.id===detail.id); if(!it) return;
    const before = it.comments;
    it.comments = it.comments.filter(c => c.id!==id); renderSocial();
    const { error } = await sb.from('bf_comments').delete().eq('id', id);

  // ----- quiet refresh: friends' changes show up when you come back to the app -----
  let lastRefresh = Date.now(), refreshing = false;
  async function refreshRooms(){
    const res = await fetchRooms(); if(res.error) return false;
    rooms = res.rooms; await signPhotos(rooms.flatMap(r => r.ideas.concat(r.plans))).catch(()=>{});
    lastRefresh = Date.now(); return true;
  }
  async function quietRefresh(){
    if(refreshing || !user || modal || pm || detail || drag || moveBox || !['home','room'].includes(view.name)) return;
    if(Date.now() - lastRefresh < 15000) return;
    refreshing = true;
    try{
      const was = view.name==='room' ? view.id : null;
      if(!(await refreshRooms())) return;
      if(modal || pm || detail || drag) return;          // something opened meanwhile: keep the new data, redraw later
      if(was && !rooms.some(r => r.id===was)){ view = { name:'home' }; render(); toast('이 방에 더 이상 들어갈 수 없어요.'); return; }
      keepScroll(); render();
    } finally { refreshing = false; }
  }
  document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible') quietRefresh(); });
  window.addEventListener('focus', quietRefresh);

      const im = new Image(); im.onload = () => ok(im); im.onerror = () => ok(null); im.src = url;

  });
  function wrapLines(ctx, text, maxW){
    const out = []; let line = '';
    for(const ch of String(text)){
      const t = line + ch;
      if(ctx.measureText(t).width > maxW && line){
        const sp = line.lastIndexOf(' ');
        if(sp > 0 && ch!==' '){ out.push(line.slice(0, sp)); line = line.slice(sp+1) + ch; } else { out.push(line); line = ch===' ' ? '' : ch; }
      } else line = t;
    }
    if(line) out.push(line);
    return out;
  }

  async function exportBoard(){

        if(im){ const sr = im.width/im.height; let sw = im.width, sh = im.height, sx = 0, sy = 0;

      if(cd.look.look==='grid'){ g.strokeStyle = 'rgba(101,112,42,.22)'; g.lineWidth = 1; for(let q = 14; q < cd.w; q += 14){ g.beginPath(); g.moveTo(q, 0); g.lineTo(q, cd.h); g.stroke(); } for(let q = 14; q < cd.h; q += 14){ g.beginPath(); g.moveTo(0, q); g.lineTo(cd.w, q); g.stroke(); } }

          if(sr > dr){ sw = sh*dr; sx = (im.width-sw)/2; } else { sh = sw/dr; sy = (im.height-sh)/2; }
          g.drawImage(im, sx, sy, sw, sh, cd.ph.x, cd.ph.y, cd.ph.w, cd.ph.h); }

      }

      if(cd.kind){ g.font = cd.kind.font; g.fillStyle = cd.kind.color || '#5A6376'; g.fillText(KINDS[cd.it.kind], cd.kind.x, cd.kind.y + (cd.kind.lh - 12)/2); }

        lines.slice(0, 4).forEach((ln, i) => g.fillText(ln, center ? cd.title.x + (cd.title.w - g.measureText(ln).width)/2 : cd.title.x, cd.title.y + i*cd.title.lh + (cd.title.lh - 17)/2)); }
      // no pins on idea cards (board and picture match)
      { const [bw, bh, bt, br, tilt] = STK_BOX[cd.it.imp], im = stkImg[cd.it.imp];
        let x = cd.w - br - bw, y = bt;

  // =====================================================================

  function missed(r){
    const doneIds = new Set(r.plans.filter(p => p.status==='done' && p.ideaId).map(p => p.ideaId));
    return r.ideas.filter(i => !doneIds.has(i.id)).sort((a,b) => IMP_RANK[a.imp]-IMP_RANK[b.imp] || b.createdAt-a.createdAt).map(i => {
      const ps = r.plans.filter(p => p.ideaId===i.id && !p.spont);
      const why = ps.some(p => p.status==='skip') ? '못 했어요' : ps.length ? '아직 체크 안 함' : '일정에 없었음';
      return { i, why };
    });
  }
  function openCarry(){
    const r = curRoom(); if(!r) return;
    const list = missed(r);
    if(!list.length){ toast('모든 아이디어를 다녀왔어요! 옮길 후보가 없어요.'); return; }
    const others = rooms.filter(x => x.id!==r.id).sort((a,b) => b.updatedAt-a.updatedAt);

    pm.busy = false; closePM();
    homeRoomId = target.id; view = { name:'room', id: target.id, tab:'ideas', kind:'all' }; render(); window.scrollTo(0,0);
    toast(data.length+'개를 ‘'+target.dest+'’ 방에 담았어요.' + (noPhoto ? ' (사진 '+noPhoto+'장은 복사하지 못했어요)' : ''));
  }

  // ---------- sign in / sign up ----------
  const isOwner = r => !!(user && r && r.owner===user.id);
  function acctLine(){
    return user ? '<p class="acct"><span>'+esc(user.email||'')+'</span><button type="button" data-act="logout">로그아웃</button></p>' : '';
  }
  function renderLogin(){
    const up = view.mode==='signup';
    root.innerHTML = '<div class="view create-view">'
      + '<div class="memo create-memo"><span class="tape memo-tape" aria-hidden="true" style="--tape-tilt:2deg"></span><div class="modal">'
      +   '<div class="modal-head"><h1>'+(up ? '처음이라면, 가입부터 해요' : '다시 만나서 반가워요')+'</h1></div>'
      +   '<p class="c-lede">'+(pendingJoin() ? '친구가 보낸 초대 링크로 왔어요. 먼저 '+(up ? '가입하면' : '로그인하면')+' 바로 그 방에 들어갈 수 있어요.' : up ? '이메일과 비밀번호만 있으면 돼요. 다른 기기에서도 같은 방이 보여요.' : '로그인하면 모아 둔 아이디어 방이 그대로 있어요.')+'</p>'
      +   '<form id="auth-form" novalidate>'
      +     '<div class="field"><label for="a-email">이메일</label><input type="email" id="a-email" autocomplete="email" inputmode="email" placeholder="you@example.com" value="'+esc(view.email||'')+'"><p class="err" id="e-a-email" hidden></p></div>'
      +     '<div class="field"><label for="a-pw">비밀번호</label><input type="password" id="a-pw" autocomplete="'+(up?'new-password':'current-password')+'" minlength="6">'
      +       (up ? '<p class="hint-s">6자 이상. 비밀번호 찾기는 아직 없으니 꼭 기억해 두세요.</p>' : '')
      +       '<p class="err" id="e-a-pw" hidden></p></div>'
      +     '<p class="form-err" id="form-err" hidden></p>'
      +     '<div class="actions"><div class="right"><button type="submit" class="btn primary">'+(up ? '가입하고 시작하기' : '로그인')+'</button></div></div>'
      +   '</form>'
      +   '<p class="auth-switch">'+(up ? '이미 가입했나요? <button type="button" data-act="auth-login">로그인</button>' : '처음인가요? <button type="button" data-act="auth-signup">가입하기</button>')+'</p>'
      + '</div></div></div>';
    document.getElementById('auth-form').addEventListener('submit', onAuth);
    ['a-email','a-pw'].forEach(id => document.getElementById(id).addEventListener('input', () => { setErr(id, ''); formErr(''); }));
  }
  async function onAuth(ev){
    ev.preventDefault();
    const btn = ev.target.querySelector('button[type=submit]'); if(btn.disabled) return;
    const email = document.getElementById('a-email').value.trim();
    const password = document.getElementById('a-pw').value;
    const up = view.mode==='signup';
    const errs = {
      'a-email': !email ? '이메일을 적어 주세요.' : (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) ? '이메일 주소가 맞는지 확인해 주세요.' : ''),
      'a-pw': !password ? '비밀번호를 적어 주세요.' : (up && password.length < 6 ? '비밀번호는 6자 이상으로 정해 주세요.' : '')
    };
    let first = null;
    Object.keys(errs).forEach(k => { setErr(k, errs[k]); if(errs[k] && !first) first = k; });
    if(first){ document.getElementById(first).focus(); return; }
    view.email = email;
    btn.disabled = true; const label = btn.textContent; btn.textContent = up ? '가입하는 중…' : '로그인 중…';
    let res;
    try{ res = up ? await sb.auth.signUp({ email, password }) : await sb.auth.signInWithPassword({ email, password }); }
    catch(err){ res = { error: err }; }
    if(res.error){ btn.disabled = false; btn.textContent = label; formErr(errText(res.error)); return; }
    if(up && !res.data.session){
      // only happens if email confirmation is switched on in Supabase
      btn.disabled = false; btn.textContent = label;
      formErr('메일함에서 확인 링크를 누른 뒤 로그인해 주세요.'); view.mode = 'login'; return;
    }
    await signedIn(res.data.session.user);
  }

  function renderLoading(msg){
    root.innerHTML = '<div class="view create-view"><p class="loading-note" role="status">'+esc(msg||'불러오는 중…')+'</p></div>';
  }
  function renderFail(){
    root.innerHTML = '<div class="view create-view"><div class="loading-note" role="alert"><span>'+esc(view.msg||'잠시 문제가 생겼어요.')+'</span>'
      + (sb ? '<button type="button" class="btn" data-act="retry">다시 불러오기</button>' : '') + '</div></div>';
  }

  async function loadRooms(){
    view = { name:'loading', msg:'아이디어 방을 불러오는 중…' }; render();
    const res = await fetchRooms();
    if(res.error){ view = { name:'fail', msg:'방을 불러오지 못했어요. '+errText(res.error) }; render(); return; }
    rooms = res.rooms; lastRefresh = Date.now();
    await signPhotos(rooms.flatMap(r => r.ideas.concat(r.plans))).catch(()=>{});
    const code = pendingJoin();
    view = code ? { name:'join', code } : { name:'home' }; render();
    if(!code) offerMove();
  }
  // newest tables first; if a later SQL file hasn't been run yet, fall back so the app still opens
  const SELECTS = [
    ['*, bf_room_members(*), bf_ideas(*, bf_likes(*), bf_comments(*)), bf_plans(*)', true, true],
    ['*, bf_ideas(*), bf_plans(*)', true, false],
    ['*, bf_ideas(*)', false, false]
  ];
  async function fetchRooms(){
    let last = null;
    for(const [sel, plans, together] of SELECTS){
      const { data, error } = await sb.from('bf_rooms').select(sel);
      if(!error && data){ plansReady = plans; togetherReady = together; return { rooms: data.map(roomFromRow) }; }
      last = error;
      if(!/relationship|schema cache|does not exist|column|bf_/i.test((error && error.message)||'')) break;
    }
    return { error: last || new Error('load') };
  }
  async function signedIn(u){
    if(user && u && user.id===u.id) return;
    user = u; homeRoomId = null;
    await loadRooms();
  }
  function signedOut(){
    user = null; rooms = []; homeRoomId = null;
    closePM(true); closeModal(false); closeDetail(false); closeMove();
    view = { name:'login', mode:'login' }; render();
  }

  // ---------- one-time move: rooms made in this browser before the server existed ----------
  const MOVED = KEY + '.moved';
  function localRooms(){
    try{
      if(localStorage.getItem(MOVED)) return [];
      const v = JSON.parse(localStorage.getItem(KEY) || '[]');
      return Array.isArray(v) ? v.filter(r => r && r.dest) : [];
    }catch(e){ return []; }
  }
  let moveBox = null;
  function offerMove(){
    const list = localRooms(); if(!list.length || moveBox) return;
    const n = list.reduce((s,r)=>s + (r.ideas||[]).length, 0);
    moveBox = document.createElement('div');
    moveBox.className = 'scrim'; moveBox.id = 'move-scrim';
    moveBox.innerHTML = '<div class="memo mig" role="dialog" aria-modal="true" aria-labelledby="mv-title"><span class="tape memo-tape" aria-hidden="true" style="--tape-tilt:-2deg"></span><div class="modal">'
      + '<div class="modal-head"><h2 id="mv-title">예전에 만든 방이 있어요</h2></div>'
      + '<p>이 브라우저에만 저장된 방 '+list.length+'개(아이디어 '+n+'개)를 내 계정으로 옮길까요?</p>'
      + '<small>옮기면 다른 기기에서도 보여요. 이 브라우저에 있던 원본은 그대로 남아 있어요.</small>'
      + '<p class="form-err" id="mv-err" hidden></p>'
      + '<div class="actions" id="mv-actions"><div class="right"><button type="button" class="btn" data-act="move-skip">안 옮길래요</button><button type="button" class="btn primary" data-act="move-go">옮기기</button></div></div>'
      + '</div></div>';
    document.body.appendChild(moveBox);
    document.body.style.overflow = 'hidden';
    moveBox.querySelector('[data-act=move-go]').focus();
  }
  function closeMove(){ if(moveBox){ moveBox.remove(); moveBox = null; document.body.style.overflow = ''; } }
  async function moveLocal(){
    const list = localRooms(); const btns = moveBox.querySelectorAll('button');
    btns.forEach(b => b.disabled = true);
    const go = moveBox.querySelector('[data-act=move-go]');
    let done = 0, failed = 0;
    for(const lr of list){
      go.textContent = '옮기는 중… ('+(done+1)+'/'+list.length+')';
      const start = lr.start && lr.end ? lr.start : null, end = lr.start && lr.end ? lr.end : null;
      const { data: rd, error } = await sb.from('bf_rooms').insert({
        dest: String(lr.dest).slice(0,30), name: String(lr.name || lr.dest+' 여행').slice(0,40),
        type: lr.type==='group' ? 'group' : 'solo', start_date: start, end_date: end
      }).select().single();
      if(error || !rd){ failed++; continue; }
      for(const li of (lr.ideas||[])){
        let path = null;
        if(li.photo && /^data:image\//.test(li.photo)){
          try{ const blob = await (await fetch(li.photo)).blob(); path = await uploadPhoto(rd.id, blob); }catch(e){ path = null; }
        }
        const { error: ie } = await sb.from('bf_ideas').insert({
          room_id: rd.id, kind: KINDS[li.kind] ? li.kind : 'etc', title: String(li.title||'아이디어').slice(0,50),
          memo: String(li.memo||'').slice(0,200), place: String(li.place||'').slice(0,60), link: String(li.link||'').slice(0,300),
          imp: IMP[li.imp] ? li.imp : 'nice', photo_path: path, photo_ratio: path ? (li.ratio||null) : null,
          x: typeof li.x==='number' ? Math.round(li.x) : null, y: typeof li.y==='number' ? Math.round(li.y) : null, z: li.z||1
        });
        if(ie){ failed++; dropUpload(path); }
      }
      done++;
    }
    try{ localStorage.setItem(MOVED, String(Date.now())); }catch(e){}
    closeMove();
    await loadRooms();
    toast(failed ? '옮겼지만 '+failed+'개는 옮기지 못했어요.' : '방 '+done+'개를 내 계정으로 옮겼어요.');
  }

  function render(){
    car = null; canvasRoom = null;
    if(!user && view.name!=='loading' && view.name!=='fail') view = { name:'login', mode: view.mode||'login', email: view.email };
    document.body.classList.toggle('room-mode', view.name==='room');
    document.body.classList.toggle('tab-ideas', view.name==='room' && view.tab==='ideas');
    if(view.name==='edit-room' && !rooms.some(x => x.id===view.id)) view = { name:'home' };
    document.body.classList.toggle('paper-mode', ['new-room','edit-room','join','login','loading','fail'].includes(view.name) || (view.name==='home' && !rooms.length));
    if(view.name==='loading') renderLoading(view.msg);
    else if(view.name==='fail') renderFail();
    else if(view.name==='login') renderLogin();
    else if(view.name==='new-room') renderCreate(false);
    else if(view.name==='join') renderJoin();
    else if(view.name==='edit-room') renderCreate(false, rooms.find(x => x.id===view.id));
    else if(view.name==='room') renderRoom();
    else renderHome();
  }

  // ---------- events ----------
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act],[data-open],[data-tab],[data-kind],[data-view],[data-go],[data-step]');
    if(!el) return;
    const top = () => window.scrollTo(0,0);
    if(car && car.suppressClick){ e.preventDefault(); return; } // a drag just ended, don't open a room
    if(Date.now() < suppressClickUntil && el.closest('.sc')){ e.preventDefault(); return; } // a card was just dropped
    if(view.menu && !el.closest('.rl-menu-wrap')){ view.menu = false; view.confirmRoom = false; view.confirmLeave = false; }
    if(el.dataset.go){ if(car) car.go(Number(el.dataset.go)); return; }
    // a dimmed side window slides into the middle instead of opening
    const side = el.dataset.open && el.closest('.slide:not(.is-active)');
    if(side && car){ car.go(Number(side.dataset.i)); return; }
    if(el.dataset.open){ homeRoomId = el.dataset.open; view = { name:'room', id:el.dataset.open, tab:'ideas', kind:'all' }; render(); top(); return; }
    if(el.dataset.tab){ view.tab = el.dataset.tab; view.menu = false; render(); document.getElementById('tab-'+view.tab).focus(); return; }
    if(el.dataset.kind){ const sc0 = document.getElementById('cv-scroll'); if(sc0) pendingScroll = { left: sc0.scrollLeft, top: sc0.scrollTop }; view.kind = el.dataset.kind; render(); return; }
    if(el.dataset.view){ openDetail(el.dataset.view); return; }
    const act = el.dataset.act;
    if(act==='home'){ if(view.name==='join') setPendingJoin(''); view = { name:'home' }; render(); top(); }
    else if(act==='new-room'){ view = { name:'new-room' }; render(); top(); }
    else if(act==='edit-room'){ view = { name:'edit-room', id:view.id, from: view.tab || 'ideas' }; render(); top(); }
    else if(act==='back-room'){ view = { name:'room', id:view.id, tab: view.from || 'ideas', kind:'all' }; render(); top(); }
    else if(act==='add-idea'){ openModal('add'); }
    else if(act==='close-modal'){ closeModal(); }
    else if(act==='close-detail'){ closeDetail(); }
    else if(act==='edit-from-detail'){ if(detail){ const id = detail.id; closeDetail(false); openModal('edit', id, { fromDetail:true }); } }
    else if(act==='drop-photo'){ const m = ps(); if(m){ m.photo = ''; m.photoPath = ''; m.blob = null; m.ratio = 0; renderPhotoSlot(); } }
    else if(act==='ask-del-idea'){ if(modal){ modal.confirmDel = true; renderModalActions(); } }
    else if(act==='keep-idea'){ if(modal){ modal.confirmDel = false; renderModalActions(); } }
    else if(act==='del-idea'){ deleteIdea(); }
    else if(act==='room-menu'){ const sc0 = document.getElementById('cv-scroll'); if(sc0) pendingScroll = { left: sc0.scrollLeft, top: sc0.scrollTop }; view.menu = !view.menu; view.confirmRoom = false; view.confirmLeave = false; render(); }
    else if(act==='ask-room'){ view.menu = true; view.confirmRoom = true; render(); }
    else if(act==='keep-room'){ view.confirmRoom = false; view.confirmLeave = false; view.menu = false; render(); }
    else if(act==='ask-leave'){ view.menu = true; view.confirmLeave = true; render(); }
    else if(act==='leave'){ leaveRoom(el); }
    else if(act==='join'){ view = { name:'join', code: pendingJoin() }; render(); top(); }
    else if(act==='people'){ view.menu = false; keepScroll(); render(); openPeople(); }
    else if(act==='copy-code'){ const r = curRoom(); if(r) copyText(r.code).then(() => toast('초대 코드 '+r.code+'를 복사했어요.'), () => toast('복사하지 못했어요. 코드: '+r.code)); }
    else if(act==='share-link'){ shareLink(); }
    else if(act==='reset-code'){ resetCode(); }
    else if(act==='kick'){ kickMember(el.dataset.uid, !!el.dataset.sure); }
    else if(act==='edit-room-pm'){ closePM(true); view = { name:'edit-room', id:view.id, from: view.tab || 'ideas' }; render(); top(); }
    else if(act==='like'){ toggleLike(); }
    else if(act==='del-comment'){ deleteComment(el.dataset.id); }
    else if(act==='export'){ view.menu = false; view.confirmRoom = false; exportBoard(); }
    else if(act==='carry'){ view.menu = false; keepScroll(); render(); openCarry(); }
    else if(act==='del-room'){
      const id = view.id, gone = rooms.find(x => x.id===id);
      el.disabled = true; el.textContent = '지우는 중…';
      // photos first: once the room is gone, nobody is a member any more and the photo folder can't be reached
      (gone ? removeRoomPhotos(gone) : Promise.resolve()).then(() => sb.from('bf_rooms').delete().eq('id', id)).then(({ error }) => {
        if(error){ toast('방을 지우지 못했어요. '+errText(error)); view.confirmRoom = false; view.menu = false; render(); return; }
        rooms = rooms.filter(r => r.id!==id);
        if(view.name==='room' && view.id===id){ view = { name:'home' }; render(); top(); }
        toast('방을 지웠어요.');
      });
    }
    else if(act==='plan-pick'){ openPick(el.dataset.day || ''); }
    else if(act==='plan-edit'){ openPlanItem(el.dataset.id); }
    else if(act==='plan-add'){ if(detail){ const id = detail.id; closeDetail(false); openPlanItem(null, id); } }
    else if(act==='plan-idea'){ closePM(true); openDetail(el.dataset.id); }
    else if(act==='rec-edit'){ openRecord(el.dataset.id); }
    else if(act==='rec-spont'){ openRecord(null, el.dataset.day); }
    else if(act==='rec-mark'){ markPlan(el.dataset.id, el.dataset.st); }
    else if(act==='rmode'){ keepScroll(); view.rmode = el.dataset.mode; render(); }
    else if(act==='close-pm'){ closePM(); }
    else if(act==='pm-ask-del'){ if(pm){ pm.confirmDel = true; renderPMActions(); } }
    else if(act==='pm-keep'){ if(pm){ pm.confirmDel = false; renderPMActions(); } }
    else if(act==='pm-del'){ deletePM(); }
    else if(act==='auth-login' || act==='auth-signup'){
      const em = document.getElementById('a-email');
      view = { name:'login', mode: act==='auth-signup' ? 'signup' : 'login', email: em ? em.value.trim() : '' }; render();
      document.getElementById(view.email ? 'a-pw' : 'a-email').focus();
    }
    else if(act==='logout'){ sb.auth.signOut().then(()=>{}, ()=>{}); signedOut(); top(); }
    else if(act==='retry'){ if(user) loadRooms(); else boot(); }
    else if(act==='move-go'){ moveLocal(); }
    else if(act==='move-skip'){ try{ localStorage.setItem(MOVED, 'skip'); }catch(e){} closeMove(); }
  });

  async function boot(){
    if(!sb){ view = { name:'fail', msg:'서버에 연결하는 도구를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.' }; render(); return; }
    view = { name:'loading' }; render();
    let session = null;
    try{ const { data } = await sb.auth.getSession(); session = data && data.session; }catch(e){}
    if(session) await signedIn(session.user);
    else { view = { name:'login', mode:'login' }; render(); }
  }
  if(sb) sb.auth.onAuthStateChange((event, session) => {
    // run outside the callback: supabase asks not to await its own calls in here
    setTimeout(() => {
      if(event==='SIGNED_OUT' && user) signedOut();
      else if(event==='SIGNED_IN' && session && user && session.user.id!==user.id) { user = null; signedIn(session.user); }
    }, 0);
  });
  boot();
})();
</script>

</body>
</html>
