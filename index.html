<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="여행 전 설레는 아이디어를 스크랩북처럼 모으는 여행 앱">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Butterflight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Nanum+Pen+Script&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column (max 680px). Home = idea rooms as boarding-pass tickets; room = idea board first */
:root{
  --bg:#EEF2F7; --surface:#FFFFFF; --ink:#16213B; --muted:#5A6680; --line:#D6DDE8;
  --accent:#E9A23B; --accent-soft:#FCEFD8; --accent-ink:#8A560A;
  --plan:#2C5BCB; --plan-bg:#E3EBFB; --trip:#1C7650; --trip-bg:#DDF2E7; --done:#5A6680; --done-bg:#E6EAF1;
  --must:#B4321F; --must-bg:#FBE4DF;
  --danger:#B3261E; --danger-bg:#FBE6E4;
  --frame:#F8FAFD; --frame-edge:#CDD5E2; --frame-hi:#FFFFFF; --shadow:rgba(22,33,59,.45);
  --sky-top:#1C3B7E; --sky-bottom:#3A6BC2; --glow:rgba(240,170,80,.42); --pane-edge:rgba(10,20,45,.35);
  --on-sky:#FFFFFF; --on-sky-2:rgba(255,255,255,.9);
  --shade:#E9EEF5; --shade-2:#D9E0EB; --shade-handle:#AEB9CB;
  --cloud:#FFFFFF; --cloud-op:1;
  --board:#E3E8F0; --board-dot:#CDD5E1; --paper:#FFFDF6; --paper-line:#E7E2D3; --kraft:#E5D6BC; --sticky:#FBEFC4;
  --photo-frame:#FFFFFF; --card-ink:#1C2639; --card-muted:#5A6376; --tape-a:rgba(169,195,255,.72); --tape-b:rgba(246,214,150,.78);
  --scrim:rgba(196,206,221,.55);
  --f-pen:"Nanum Pen Script","Gowun Batang",cursive;
  --dot-idea:#F5C46E; --dot-plan:#A9C3FF; --dot-trip:#8EE3BA; --dot-done:#CBD2DE;
  --f-display:"Gowun Batang","Noto Serif KR",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1626; --surface:#182238; --ink:#E8EDF7; --muted:#9BA7BF; --line:#2B3752;
    --accent:#F0B356; --accent-soft:#3A2E17; --accent-ink:#F6CF8E;
    --plan:#93B2FF; --plan-bg:#1E2D52; --trip:#7FD8AE; --trip-bg:#173A2D; --done:#AAB4C8; --done-bg:#252F45;
    --must:#FF9E8C; --must-bg:#41221C;
    --danger:#FF9C93; --danger-bg:#3D1F1D; color-scheme:dark;
    --frame:#212B42; --frame-edge:#34405C; --frame-hi:#2D3954; --shadow:rgba(0,0,0,.7);
    --sky-top:#060C20; --sky-bottom:#1A2C5C; --glow:rgba(240,170,80,.28); --pane-edge:rgba(0,0,0,.5);
    --shade:#2C3753; --shade-2:#242E47; --shade-handle:#56627E;
    --cloud:#A9B8DA; --cloud-op:.32; --board:#141D30; --board-dot:#212C45; --paper:#ECE7DA; --paper-line:#D6CFBE; --kraft:#CDBC9E; --sticky:#E8DCAE; --photo-frame:#ECE9E2; --card-muted:#565E70; --tape-a:rgba(150,176,235,.6); --tape-b:rgba(230,196,128,.66); --scrim:rgba(4,8,18,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1626; --surface:#182238; --ink:#E8EDF7; --muted:#9BA7BF; --line:#2B3752;
  --accent:#F0B356; --accent-soft:#3A2E17; --accent-ink:#F6CF8E;
  --plan:#93B2FF; --plan-bg:#1E2D52; --trip:#7FD8AE; --trip-bg:#173A2D; --done:#AAB4C8; --done-bg:#252F45;
  --must:#FF9E8C; --must-bg:#41221C;
  --danger:#FF9C93; --danger-bg:#3D1F1D; color-scheme:dark;
  --frame:#212B42; --frame-edge:#34405C; --frame-hi:#2D3954; --shadow:rgba(0,0,0,.7);
  --sky-top:#060C20; --sky-bottom:#1A2C5C; --glow:rgba(240,170,80,.28); --pane-edge:rgba(0,0,0,.5);
  --shade:#2C3753; --shade-2:#242E47; --shade-handle:#56627E;
  --cloud:#A9B8DA; --cloud-op:.32; --board:#141D30; --board-dot:#212C45; --paper:#ECE7DA; --paper-line:#D6CFBE; --kraft:#CDBC9E; --sticky:#E8DCAE; --photo-frame:#ECE9E2; --card-muted:#565E70; --tape-a:rgba(150,176,235,.6); --tape-b:rgba(230,196,128,.66); --scrim:rgba(4,8,18,.5);
}
*{box-sizing:border-box}
html{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:0;min-height:100%;word-break:keep-all;display:flex;flex-direction:column}
.wrap{width:100%;max-width:680px;margin:0 auto;flex:1;display:flex;flex-direction:column}
#view{flex:1;display:flex;flex-direction:column;padding-top:20px}
#view>.view{flex:1;display:flex;flex-direction:column}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
a{color:var(--plan)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* bottom brand */
.foot-brand{display:flex;justify-content:center;padding-block:28px 24px}
.brand{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:6px 10px;border-radius:10px;color:var(--ink)}
.brand svg{width:24px;height:24px;flex:none}
.brand b{font-family:var(--f-display);font-size:17px;letter-spacing:.01em}

/* home: airplane windows */
.home{justify-content:center;align-items:center;text-align:center}
.home-title{font-family:var(--f-display);font-size:clamp(23px,6vw,30px);line-height:1.35;padding-inline:8px}
.carousel{position:relative;width:100%;margin-top:clamp(28px,6vh,52px)}
.track{display:flex;gap:var(--gap);overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-inline:calc(50% - var(--win-w) / 2);padding-block:10px 18px;user-select:none;-webkit-user-select:none;touch-action:pan-x pan-y;--gap:24px}
.track::-webkit-scrollbar{display:none}
.track.multi{-webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);cursor:grab}
.track.dragging{scroll-snap-type:none;cursor:grabbing}
.track.single{justify-content:center;overflow:visible}
.slide{flex:0 0 auto;scroll-snap-align:center;transition:opacity .3s ease,transform .3s ease}
.track.multi .slide:not(.is-active){opacity:.42;transform:scale(.92)}
.carousel{--win-w:min(72vw,300px,calc(52vh * .714))}
.window{display:block;width:var(--win-w);aspect-ratio:5/7;max-width:100%;padding:16px;border:1px solid var(--frame-edge);border-radius:44% / 32%;background:var(--frame);box-shadow:0 18px 40px -22px var(--shadow),inset 0 2px 0 var(--frame-hi);cursor:pointer;transition:transform .25s ease,box-shadow .25s ease}
.track:not(.dragging) .slide.is-active .window:hover{transform:translateY(-4px);box-shadow:0 26px 48px -24px var(--shadow),inset 0 2px 0 var(--frame-hi)}
.window:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.pane{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:100%;border-radius:42% / 30%;overflow:hidden;padding:26% 13% 15%;color:var(--on-sky);
  background:radial-gradient(120% 40% at 50% 112%,var(--glow),transparent 70%),linear-gradient(180deg,var(--sky-top),var(--sky-bottom));
  box-shadow:inset 0 0 0 1px var(--pane-edge),inset 0 10px 24px -12px rgba(0,0,0,.45)}
.pane::before{content:"";position:absolute;inset:0 0 auto 0;height:15%;background:linear-gradient(180deg,var(--shade),var(--shade-2));box-shadow:0 2px 6px -2px rgba(0,0,0,.35)}
.pane::after{content:"";position:absolute;top:calc(15% - 9px);left:50%;width:30px;height:5px;margin-left:-15px;border-radius:3px;background:var(--shade-handle)}
/* clouds sit only in the empty band between the date and the count, and along the bottom edge */
.clouds{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:var(--cloud-op)}
.clouds g{fill:var(--cloud)}
.clouds .drift-a{animation:drift 26s ease-in-out infinite alternate}
.clouds .drift-b{animation:drift 32s ease-in-out infinite alternate-reverse}
@keyframes drift{from{transform:translateX(-2.5px)}to{transform:translateX(2.5px)}}
@media (prefers-reduced-motion: reduce){.clouds .drift-a,.clouds .drift-b{animation:none}}
.pane>span{position:relative;text-shadow:0 1px 8px rgba(12,28,70,.35)}
.w-status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 11px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);white-space:nowrap}
.w-status i{width:7px;height:7px;border-radius:50%;background:var(--dot);flex:none}
.w-dest{display:block;font-family:var(--f-display);font-size:clamp(24px,7.5vw,32px);line-height:1.28;margin-top:6px;padding-bottom:2px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.w-name{display:block;font-size:14px;color:var(--on-sky-2);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-date{display:block;font-family:var(--f-mono);font-size:12px;color:var(--on-sky-2)}
.w-count{display:flex;flex-direction:column;align-items:center;margin-top:auto;padding-top:10px;border-top:1px solid rgba(255,255,255,.22);width:72%}
.w-count b{font-family:var(--f-mono);font-weight:600;font-size:clamp(30px,9vw,40px);line-height:1.1;font-variant-numeric:tabular-nums}
.w-count small{font-size:12px;color:var(--on-sky-2)}
@media (max-height:700px){
  #view{padding-top:12px}
  .carousel{margin-top:20px}
  .track{padding-block:6px 12px}
  .new-room{margin-top:12px}
  .foot-brand{padding-block:14px 10px}
}
.dots{display:flex;justify-content:center;gap:8px;margin-top:4px}
.dot{width:8px;height:8px;padding:0;border-radius:999px;border:0;background:var(--line);transition:width .25s ease,background .25s ease}
.dot[aria-current="true"]{width:22px;background:var(--ink)}
.dot-hit{display:grid;place-items:center;min-width:24px;height:24px;background:none;border:0;padding:0}
.new-room{margin-top:22px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:10px 20px;font-weight:600}
.new-room:hover{border-color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:11px 18px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.accent{background:var(--accent);color:#2A1A00;border-color:var(--accent)}
.btn.danger{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.btn.small{padding:6px 12px;font-size:13px;border-radius:8px}
.btn.ghost-danger{background:none;color:var(--danger);border-color:transparent;padding-inline:4px;font-weight:500}
.back{background:none;border:0;padding:4px 0;color:var(--muted);font-weight:500}

.page-head{display:grid;gap:8px;padding-block:8px 20px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink)}
.page-head h1{font-family:var(--f-display);font-size:clamp(26px,6vw,32px);line-height:1.3}
.page-head p.lede{color:var(--muted)}

/* room tickets */
.rooms{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.ticket{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 96px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0}
button.ticket:hover{border-color:var(--muted)}
.ticket::before,.ticket::after{content:"";position:absolute;right:88px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.ticket::before{top:-9px;clip-path:inset(50% 0 0 0)}
.ticket::after{bottom:-9px;clip-path:inset(0 0 50% 0)}
.t-main{display:grid;gap:4px;padding:16px 18px;min-width:0}
.t-top{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.t-dest{font-family:var(--f-display);font-size:24px;line-height:1.25;overflow-wrap:anywhere}
.t-name{color:var(--muted);overflow-wrap:anywhere}
.t-date{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.t-stub{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-left:2px dashed var(--line);padding:12px 6px;text-align:center}
.t-small{font-size:11px;color:var(--muted)}
.t-big{font-family:var(--f-mono);font-weight:600;font-size:24px;line-height:1.1;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.add-room{width:100%;border:1.5px dashed var(--line);background:none;border-radius:14px;padding:16px;color:var(--muted);font-weight:600}
.add-room:hover{border-color:var(--muted);color:var(--ink)}

.pill,.badge{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;white-space:nowrap}
.pill.idea{background:var(--accent-soft);color:var(--accent-ink)}
.pill.plan{background:var(--plan-bg);color:var(--plan)}
.pill.trip{background:var(--trip-bg);color:var(--trip)}
.pill.done{background:var(--done-bg);color:var(--done)}
.badge{border:1px solid var(--line);color:var(--muted);font-weight:500}

/* forms */
form.card{display:grid;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.field{display:grid;gap:6px;min-width:0}
.field>label,.field legend{font-weight:600;font-size:14px}
.opt{font-weight:400;color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}
input[type=text],input[type=url],input[type=date],textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{resize:vertical;min-height:72px}
[aria-invalid="true"]{border-color:var(--danger)!important}
.err{font-size:13px;color:var(--danger)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
fieldset{border:0;margin:0;padding:0;min-width:0}
.seg{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:8px;margin-top:6px}
.seg label{position:relative;display:block;cursor:pointer}
.seg input{position:absolute;opacity:0;inset:0;margin:0}
.seg .body{display:grid;gap:2px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);height:100%;text-align:center}
.seg.left .body{text-align:left}
.seg .body b{font-weight:600}
.seg .body small{color:var(--muted);font-size:12px}
.seg input:checked + .body{border-color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1px var(--ink)}
.seg input:focus-visible + .body{outline:2px solid var(--accent);outline-offset:2px}
.actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}

/* room: the whole screen is the board. Small paper props float on top of it. */
body.room-mode{overflow:hidden}
body.room-mode .foot-brand{display:none}
.view.room-view{position:fixed;inset:0;z-index:20;animation:none}
.cv-scroll{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;
  background:radial-gradient(circle,var(--board-dot) 1px,transparent 1.4px) 0 0/18px 18px,var(--board)}
.cv-sizer{position:relative}
.cv{list-style:none;margin:0;padding:0;position:absolute;left:0;top:0;transform-origin:0 0}
.sc{position:absolute;width:var(--w);touch-action:auto;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.sc img{-webkit-user-drag:none;pointer-events:none}
@media (hover:hover) and (pointer:fine){.sc{cursor:grab}}
.sc.dragging{cursor:grabbing}
.sc.dragging .sc-card{transform:rotate(0deg) scale(1.04)!important;box-shadow:0 2px 3px rgba(20,30,50,.12),0 26px 40px -18px rgba(20,30,50,.6);transition:transform .12s ease}
.sc.dim{opacity:.16;pointer-events:none;filter:grayscale(.6)}
.sc{transition:opacity .25s ease}

/* floating props */
.prop{position:fixed;z-index:30}
.rlabel{top:calc(12px + env(safe-area-inset-top,0px));left:14px;display:flex;align-items:flex-start;gap:10px;max-width:min(460px,calc(100% - 210px));
  background:var(--paper);color:var(--card-ink);padding:12px 14px 11px 10px;border-radius:2px;transform:rotate(-1deg);box-shadow:0 8px 18px -12px rgba(20,30,50,.55)}
.rlabel .tape{width:54px;margin-left:-27px;top:-9px}
.rl-back{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--paper-line);background:transparent;color:var(--card-ink);font-size:16px;line-height:1;display:grid;place-items:center}
.rl-back:hover{background:var(--paper-line)}
.rl-text{min-width:0;display:grid;gap:1px}
.rlabel h1{font-family:var(--f-display);font-size:20px;line-height:1.25;overflow-wrap:anywhere}
.rl-sub{font-size:12px;color:var(--card-muted);line-height:1.4;overflow-wrap:anywhere}
.rl-sub i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--dot);margin-right:5px;vertical-align:1px}
.rtools{top:calc(14px + env(safe-area-inset-top,0px));right:14px;display:flex;gap:8px;align-items:center}
.btn.add-idea{flex:none;border-radius:999px;padding:10px 18px;background:#1C2639;color:#FFFDF6;border-color:#1C2639;box-shadow:0 10px 20px -12px rgba(0,0,0,.6)}
.btn.add-idea:hover{filter:brightness(1.2)}
.rl-menu-wrap{position:relative;flex:none;align-self:flex-start}
.rl-more{width:28px;height:28px;border-radius:50%;border:0;background:transparent;color:var(--card-muted);font-size:16px;letter-spacing:1px;line-height:1}
.rl-more:hover,.rl-more[aria-expanded="true"]{background:var(--paper-line);color:var(--card-ink)}
.rmenu{position:absolute;top:34px;left:0;width:240px;background:var(--paper);color:var(--card-ink);border-radius:4px;padding:12px;box-shadow:0 18px 32px -18px rgba(0,0,0,.6);display:grid;gap:8px}
.rmenu .btn{justify-content:flex-start}
.rmenu p{font-size:13px;color:var(--danger)}
.rmenu .row{display:flex;gap:8px;justify-content:flex-end}

/* notebook index tabs along the bottom edge */
.itabs{left:16px;bottom:0;display:flex;gap:3px;align-items:flex-end}
.itab{border:0;border-radius:10px 10px 0 0;padding:9px 16px calc(14px + env(safe-area-inset-bottom,0px));font-size:14px;font-weight:600;color:var(--card-ink);background:var(--tabc);
  transform:translateY(6px);box-shadow:0 -3px 10px -6px rgba(20,30,50,.5);transition:transform .2s ease}
.itab:hover{transform:translateY(2px)}
.itab[aria-selected="true"]{transform:none;background:var(--paper)}
.itab .n{font-family:var(--f-mono);font-size:11px;margin-left:5px;opacity:.7}
.itab.t-ideas{--tabc:var(--sticky)} .itab.t-plan{--tabc:#DCE5F6} .itab.t-record{--tabc:var(--kraft)}

/* kind filter as round stickers */
.kstick{right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center}
.kst{position:relative;width:46px;height:46px;border-radius:50%;border:0;padding:0;font-size:12px;font-weight:700;background:var(--paper);color:var(--card-ink);
  transform:rotate(var(--r,0deg));box-shadow:0 4px 10px -6px rgba(20,30,50,.6),inset 0 0 0 2px rgba(255,255,255,.6)}
.kst[aria-pressed="true"]{background:#1C2639;color:#FFFDF6}
.kst .n{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--accent);color:#2A1A00;font-size:10px;line-height:18px;font-family:var(--f-mono)}
.kst:disabled{opacity:.45;cursor:default}

/* other tabs: one paper sheet on the board */
.sheet-wrap{min-height:100%;display:grid;place-items:start center;padding:110px 16px 120px}
.sheet{width:100%;max-width:560px;background:var(--paper);color:var(--card-ink);border-radius:3px;padding:22px 20px;box-shadow:0 12px 26px -18px rgba(20,30,50,.6);display:grid;gap:12px}
.sheet .empty{border-color:var(--paper-line);color:var(--card-muted)}
.sheet .empty strong{color:var(--card-ink)}

.sc-card{position:relative;transform:rotate(var(--tilt,0deg));transition:transform .2s ease;color:var(--card-ink);box-shadow:0 1px 1px rgba(20,30,50,.08),0 8px 18px -12px rgba(20,30,50,.45)}

}
/* card looks */
.polaroid .sc-card{background:var(--photo-frame);padding:9px 9px 2px;border-radius:2px}
.polaroid .ph{aspect-ratio:1}
.polaroid .sc-body{padding:10px 4px 10px}
.print .sc-card{background:var(--paper);border-radius:3px}
.print .ph{aspect-ratio:var(--ratio,4/3);border-radius:3px 3px 0 0}
.stamp .sc-card{padding:9px;border-radius:2px;background:radial-gradient(circle,var(--board) 2.6px,transparent 3px) -2px -2px/11px 11px,var(--photo-frame)}
.stamp .ph{aspect-ratio:4/5}
.stamp .sc-body{background:var(--photo-frame);padding:9px 4px 4px}
.paper .sc-card{border-radius:2px;background:repeating-linear-gradient(180deg,transparent 0 23px,var(--paper-line) 23px 24px) 0 38px,var(--paper)}
.paper .sc-body{padding:16px 14px 16px}
.grid .sc-card{border-radius:2px;background:linear-gradient(var(--paper-line) 1px,transparent 1px) 0 0/14px 14px,linear-gradient(90deg,var(--paper-line) 1px,transparent 1px) 0 0/14px 14px,var(--paper)}
.grid .sc-body{padding:16px 14px 16px}
.kraft .sc-card{background:var(--kraft);border-radius:4px 4px 14px 4px}
.kraft .sc-card::before{content:"";position:absolute;top:12px;left:12px;width:9px;height:9px;border-radius:50%;background:var(--board);box-shadow:inset 0 1px 2px rgba(0,0,0,.3)}
.kraft .sc-body{padding:26px 14px 16px}
.sticky .sc-card{background:var(--sticky);border-radius:2px 2px 2px 18px}
.sticky .sc-body{padding:18px 14px 20px}
/* chosen card shapes. The shape is cut on an inner layer, so the sticker, the focus ring and the click area on the card are never clipped. */
/* stamp: cream paper with deep round perforations; bold title and a small red line on top, the photo below (like a postage stamp) */
.perf .sc-card{isolation:isolate;display:flex;flex-direction:column;padding:22px 20px 24px;background:none;box-shadow:none;color:#16181D;
  filter:drop-shadow(0 1px 1px rgba(20,30,50,.16)) drop-shadow(0 8px 10px rgba(20,30,50,.24))}
.sc.dragging.perf .sc-card{box-shadow:none;filter:drop-shadow(0 2px 2px rgba(20,30,50,.16)) drop-shadow(0 18px 16px rgba(20,30,50,.32))}
.perf .sc-card::before,.pv-stamp{--r:6.5px;
  -webkit-mask:radial-gradient(var(--r),#0000 97%,#000) round calc(-1.5 * var(--r)) calc(-1.5 * var(--r)) / calc(3 * var(--r)) calc(3 * var(--r)),linear-gradient(#000 0 0) no-repeat 50% / calc(100% - 3 * var(--r)) calc(100% - 3 * var(--r));
  mask:radial-gradient(var(--r),#0000 97%,#000) round calc(-1.5 * var(--r)) calc(-1.5 * var(--r)) / calc(3 * var(--r)) calc(3 * var(--r)),linear-gradient(#000 0 0) no-repeat 50% / calc(100% - 3 * var(--r)) calc(100% - 3 * var(--r))}
.perf .sc-card::before{content:"";position:absolute;inset:0;z-index:-1;background:#F2EEE5}
.perf .sc-body{order:-1;display:grid;gap:3px;padding:0 0 12px}
.perf .sc-title{order:0;font-family:var(--f-body);font-weight:700;font-size:19px;line-height:1.18;letter-spacing:-.02em;color:#16181D}
.perf .sc-kind{order:1;font-size:11px;font-weight:700;letter-spacing:.14em;color:#C8203A}
.perf .ph{aspect-ratio:1;background:#E6E1D6}
.perf:not(.has-ph) .sc-body::after{content:"";order:2;display:block;height:72px;margin-top:10px;background:radial-gradient(circle,rgba(200,32,58,.42) 1.1px,transparent 1.5px) 0 0/5px 5px,#ECE7DC}
/* puzzle: the photo is cut into a jigsaw piece (soft shadow like the other cards, no outline); no text on photo pieces (the detail view has it) */
.puzzle .sc-card{isolation:isolate;aspect-ratio:1;padding:0;background:none;box-shadow:none}
.sc.dragging.puzzle .sc-card{box-shadow:none}
.pz{position:absolute;inset:0;filter:drop-shadow(0 1px 1px rgba(20,30,50,.16)) drop-shadow(0 8px 10px rgba(20,30,50,.24))}
.sc.dragging .pz{filter:drop-shadow(0 2px 2px rgba(20,30,50,.16)) drop-shadow(0 18px 16px rgba(20,30,50,.32))}
.pz-cut{position:absolute;inset:0;background:var(--paper);-webkit-mask:var(--piece) 0 0 / 100% 100% no-repeat;mask:var(--piece) 0 0 / 100% 100% no-repeat}
.pz-cut img{display:block;width:100%;height:100%;object-fit:cover}
.puzzle .sc-body{position:absolute;inset:30%;padding:0;display:grid;place-content:center;text-align:center}
.puzzle .sc-kind{display:none}
.puzzle .sc-title{font-size:14.5px;-webkit-line-clamp:4}
.puzzle .sc-card .sticker{top:10%;right:9%}
.puzzle .sc-hit:focus-visible,.perf .sc-hit:focus-visible{outline-offset:2px}
/* card shape picker in the add / edit memo: a tiny preview of each shape */
.memo .tpl .body{display:grid;justify-items:center;align-content:start;gap:8px;padding:12px 6px 10px;border:1px dashed var(--m-line-strong);border-radius:6px;background:var(--m-field);color:var(--m-muted);text-align:center;transition:transform .15s ease}
.memo .tpl .body b{font-size:13px;color:var(--m-ink);white-space:nowrap}
.memo .tpl label:hover input:not(:checked) + .body{border-color:var(--m-ink)}
.memo .tpl input:checked + .body{border:1.5px solid var(--m-ink);background:#FFFFFF;box-shadow:0 4px 10px -6px rgba(20,30,50,.5);transform:rotate(-1deg)}
.tpl-pv-w{display:grid;place-items:center;height:58px;filter:drop-shadow(0 1px 1px rgba(20,30,50,.2)) drop-shadow(0 3px 4px rgba(20,30,50,.18))}
.tpl-pv{position:relative;display:block;width:44px;height:52px;background:#FFFFFF}
.tpl-pv i{position:absolute;background:linear-gradient(160deg,#9DB3DA,#E9C99B)}
.pv-polaroid{transform:rotate(-3deg)}
.pv-polaroid i{inset:4px 4px 14px}

.pv-stamp::before{content:"";position:absolute;left:8px;top:8px;width:18px;height:4px;border-radius:1px;background:#16181D;box-shadow:0 6px 0 -1px #C8203A}
.pv-stamp i{left:8px;right:8px;top:20px;bottom:8px}
.pv-puzzle{width:54px;height:54px;background:none}
.pv-puzzle i{inset:0;-webkit-mask:var(--piece) 0 0 / 100% 100% no-repeat;mask:var(--piece) 0 0 / 100% 100% no-repeat}
.tape{position:absolute;top:-10px;left:50%;width:68px;height:20px;margin-left:-34px;transform:rotate(var(--tape-tilt,-4deg));background:var(--tape-a);z-index:2;pointer-events:none;
  clip-path:polygon(0 8%,5% 0,10% 9%,16% 1%,84% 4%,90% 0,95% 8%,100% 2%,100% 92%,95% 100%,89% 92%,84% 100%,15% 96%,9% 100%,4% 92%,0 100%)}
.tape.b{background:var(--tape-b)}

/* importance stickers */
.sticker{position:absolute;z-index:3;pointer-events:none;font-size:11px;font-weight:700;line-height:1.1;text-align:center;white-space:nowrap}
.sticker.must{top:-12px;right:-10px;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#B4321F;color:#FFF8F0;transform:rotate(12deg);box-shadow:0 3px 8px -4px rgba(0,0,0,.5),inset 0 0 0 3px rgba(255,255,255,.22)}

/* empty board */
.board.is-empty{position:relative;display:grid;place-items:center;min-height:100%;padding:120px 20px 140px}

/* add / edit memo: a cream scrap note laid on the board. Paper colours stay the same in both themes, like the cards. */
.scrim{position:fixed;inset:0;z-index:50;background:var(--scrim);-webkit-backdrop-filter:blur(1.5px);backdrop-filter:blur(1.5px);display:grid;place-items:center;padding:16px;padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px))}
.memo{--m-ink:#1C2639;--m-muted:#5F6576;--m-line:#E6DECE;--m-line-strong:#CFC4AE;--m-field:rgba(255,255,255,.78);--m-red:#A3392D;
  position:relative;width:100%;max-width:520px;max-height:calc(100vh - 48px);max-height:calc(100dvh - 48px);display:flex;flex-direction:column;
  background:var(--paper);color:var(--m-ink);color-scheme:light;border:1px solid var(--m-line);border-radius:4px;
  box-shadow:0 2px 3px rgba(20,30,50,.08),0 30px 54px -30px rgba(20,30,50,.6);animation:memo-in .22s ease-out}
@keyframes memo-in{from{opacity:.5;transform:translateY(10px) rotate(-.6deg)}to{opacity:1;transform:none}}

.memo-tape{top:-11px;width:84px;margin-left:-42px;z-index:3}

.memo :focus-visible{outline:2px solid var(--m-ink);outline-offset:2px}
.memo input[type=text],.memo input[type=url],.memo textarea{background:var(--m-field);color:var(--m-ink);border:1px solid var(--m-line-strong);border-radius:6px;padding:10px 12px;transition:border-color .15s ease,box-shadow .15s ease}

.memo .tags .body::before{content:"";position:absolute;left:8px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 1px var(--m-line-strong)}
.memo .tags input:checked + .body{border:1px solid var(--m-ink);background:var(--m-ink);color:#FFFDF6;transform:rotate(-1.5deg);box-shadow:0 4px 10px -6px rgba(20,30,50,.6)}

/* importance: stickers, the picked one looks like the board sticker */
.memo .imps .body{border:1px dashed var(--m-line-strong);border-radius:999px;padding:9px 6px;background:var(--m-field);color:var(--m-muted);transition:transform .15s ease}

.photo-pick .slot{width:min(250px,100%);background:#FFFFFF;padding:10px 10px 26px;transform:rotate(-1.5deg);box-shadow:0 1px 2px rgba(20,30,50,.08),0 10px 20px -14px rgba(20,30,50,.6);transition:transform .15s ease}

.dv-kind::before{content:"";position:absolute;left:8px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--paper)}
.dv-imp{display:inline-block;padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:700}
.dv-imp.must{background:#B4321F;color:#FFF8F0;transform:rotate(3deg);box-shadow:0 4px 10px -6px rgba(120,20,10,.7)}
.dv-imp.nice{background:#FCEFD8;color:#8A560A;border:1px solid #D9B98A;transform:rotate(-2deg)}
.dv-imp.maybe{background:#FFFFFF;color:var(--m-ink);border:1.5px dashed var(--m-ink);transform:rotate(2deg)}
.dv-photo{width:fit-content;max-width:100%;margin:0 auto;background:#FFFFFF;padding:10px 10px 16px;transform:rotate(-.8deg);box-shadow:0 1px 2px rgba(20,30,50,.08),0 12px 24px -16px rgba(20,30,50,.6)}
.dv-photo img{display:block;width:auto;max-width:100%;height:auto;max-height:min(44vh,400px);object-fit:contain}
.dv-memo{font-family:var(--f-pen);font-size:22px;line-height:28px;color:var(--m-ink);white-space:pre-wrap;overflow-wrap:anywhere;padding:0 2px 4px;background:repeating-linear-gradient(180deg,transparent 0 27px,var(--m-line) 27px 28px)}
.dv-meta{margin:0;display:grid;gap:10px;padding:12px 14px;border:1px dashed var(--m-line-strong);border-radius:6px;background:var(--m-field)}
.dv-meta div{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:baseline}
.dv-meta dt{font-size:12px;font-weight:700;color:var(--m-muted)}
.dv-meta dd{margin:0;min-width:0}
.dv-meta a{display:inline-flex;gap:6px;align-items:baseline;max-width:100%;color:var(--m-ink);text-decoration:underline;text-decoration-color:var(--m-line-strong);text-underline-offset:3px}
.dv-meta a span{min-width:0;overflow-wrap:anywhere}
.dv-meta a:hover{text-decoration-color:var(--m-ink)}
.dv-meta svg{width:13px;height:13px;flex:none;align-self:center}
.dv-date{font-size:12px;color:var(--m-muted)}
.memo .form-err{font-size:13px;color:var(--m-red);background:#F7E4DF;border-radius:6px;padding:8px 12px}
@media (max-width:520px){
  .scrim{padding:12px;padding-block:calc(18px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-bottom,0px))}
  .memo .modal{padding:0 16px}
  .memo .modal-head{padding-top:22px}
  .memo .modal-head h2{font-size:20px}
  .memo .actions{margin:4px -16px 0;padding:12px 16px 14px}
  .memo .actions .right{flex:1;justify-content:flex-end}
  .photo-has img{width:110px;height:110px}
  .room-top .btn.add-idea{padding:8px 13px;font-size:13px}
}
.empty{border:1px dashed var(--line);border-radius:14px;padding:28px 20px;text-align:center;color:var(--muted);display:grid;gap:8px;justify-items:center}
.empty strong{color:var(--ink);font-weight:600}
.soon{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--accent-ink);background:var(--accent-soft);border-radius:6px;padding:2px 8px}
.days{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:8px}
.days li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.days .d{font-family:var(--f-mono);font-size:13px;font-weight:600}
.days .d span{color:var(--muted);font-weight:500;margin-left:6px}
.days .e{color:var(--muted);font-size:13px;text-align:right}
.danger-zone{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--danger-bg);border-radius:10px;padding:10px 14px;width:100%}
.confirm p{flex:1 1 200px;color:var(--danger);font-weight:500}

.view>.back{align-self:flex-start}
#toast{position:fixed;z-index:60;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:999px;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.view{animation:in .25s ease-out}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.view{animation:none}}
@media (max-width:420px){
  .row2{grid-template-columns:1fr}
  .ticket{grid-template-columns:minmax(0,1fr) 82px}
  .ticket::before,.ticket::after{right:74px}
  .seg.kinds{--cols:2!important}
}
/* sign-in memo, loading note, account line */
.memo input[type=email],.memo input[type=password]{width:100%;font:inherit;background:var(--m-field);color:var(--m-ink);border:1px solid var(--m-line-strong);border-radius:6px;padding:10px 12px;min-height:44px}
.memo input[type=email]:focus,.memo input[type=password]:focus{outline:none;border-color:var(--m-ink);box-shadow:0 0 0 3px rgba(28,38,57,.12);background:#FFFFFF}
.auth-switch{margin-top:14px;font-size:13.5px;color:var(--m-muted);text-align:center}
.auth-switch button{background:none;border:0;padding:4px 2px;font:inherit;font-weight:700;color:var(--m-ink);text-decoration:underline;text-underline-offset:3px}
.field .hint-s{font-size:12px;color:var(--m-muted);margin-top:4px}
.loading-note{margin:auto;font-family:var(--f-pen);font-size:24px;color:var(--muted);text-align:center;display:grid;gap:14px;justify-items:center}
.loading-note .btn{font-family:var(--f-body);font-size:14px}
.acct{margin-top:18px;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;justify-content:center;align-items:center}
.acct span{overflow-wrap:anywhere}
.acct button{background:none;border:0;padding:6px 4px;font:inherit;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.acct button:hover{color:var(--ink)}
.btn[disabled]{opacity:.6;cursor:progress}
.mig p{color:var(--m-ink);margin-bottom:6px}
.mig small{display:block;color:var(--m-muted);font-size:12.5px}

/* schedule + trip record sheets: always light paper, so colours come from the card palette */
.sheet.wide{max-width:640px;gap:6px}
.sheet .btn{background:transparent;color:var(--card-ink);border:1px solid var(--card-ink);box-shadow:none}
.sheet .btn:hover{background:var(--card-ink);color:var(--paper)}
.sheet .empty .btn{margin-top:4px}
.pl-head{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap;padding-bottom:12px;margin-bottom:4px;border-bottom:1px dashed var(--paper-line)}
.pl-head h2{font-family:var(--f-display);font-size:22px;color:var(--card-ink)}
.pl-head p{font-size:13px;color:var(--card-muted)}
.pl-day{display:grid;gap:8px;padding:12px 0 14px;border-bottom:1px dashed var(--paper-line)}
.pl-day:last-child{border-bottom:0;padding-bottom:2px}
.pl-day>header{display:flex;align-items:center;gap:10px;min-height:34px}
.pl-day>header b{flex:none;font-family:var(--f-mono);font-size:12.5px;letter-spacing:.04em;background:var(--card-ink);color:var(--paper);padding:3px 9px;border-radius:3px;transform:rotate(-2deg)}
.pl-day.loose>header b{background:transparent;color:var(--card-ink);border:1.5px dashed var(--card-ink);font-family:var(--f-body)}
.pl-day>header span{flex:1;min-width:0;font-size:13px;color:var(--card-muted)}
.pl-day>header .btn{flex:none;border-radius:999px}
.pl-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.pl-none{font-size:13px;color:var(--card-muted);padding:2px 2px}
.pl-item{width:100%;display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;
  background:rgba(255,255,255,.7);border:1px solid var(--paper-line);border-radius:4px;padding:10px 12px;color:var(--card-ink);transition:border-color .15s ease}
.pl-item:hover{border-color:var(--card-muted)}
.pl-time{font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--card-ink)}
.pl-time.none{font-family:var(--f-body);font-size:11.5px;font-weight:500;color:var(--card-muted)}
.pl-main{display:grid;gap:2px;min-width:0}
.pl-main b{font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.pl-main small{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--card-muted);min-width:0;overflow-wrap:anywhere}
.pl-main small svg{width:11px;height:11px;flex:none}
.pl-off{color:#A3392D!important}
.pl-kind{font-size:11px;font-weight:700;padding:3px 8px;border-radius:3px;background:var(--sticky);color:#6B5212;transform:rotate(3deg)}
.rmode{display:inline-flex;border:1px solid var(--card-ink);border-radius:999px;overflow:hidden}
.rmode button{border:0;background:transparent;color:var(--card-ink);padding:6px 13px;font-size:13px;font-weight:600}
.rmode button[aria-pressed="true"]{background:var(--card-ink);color:var(--paper)}
.rc-sum{font-size:13px;color:var(--card-muted);padding:2px 0 4px}
.rc-sum b{font-weight:700}
.rc-sum .ok{color:#1F6B4A}.rc-sum .no{color:#A3392D}.rc-sum .sp{color:#7A5A10}
.rc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.rc-main{grid-template-columns:62px minmax(0,1fr) auto}
.rc.done .rc-main{border-color:#9BC8B1;background:rgba(232,245,238,.8)}
.rc.skip .rc-main b{text-decoration:line-through;text-decoration-color:rgba(163,57,45,.6);color:var(--card-muted)}
.rc-note{font-family:var(--f-pen);font-size:18px;line-height:1.15;color:var(--card-muted);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rc-thumb{width:44px;height:44px;object-fit:cover;border:3px solid #fff;box-shadow:0 3px 8px -4px rgba(20,30,50,.6);transform:rotate(3deg)}
.rc-checks{display:flex;gap:4px}
.rc-checks button{border:1px dashed var(--card-muted);background:transparent;color:var(--card-muted);border-radius:999px;padding:7px 11px;font-size:12.5px;font-weight:600;white-space:nowrap}
.rc-checks button:hover{color:var(--card-ink);border-color:var(--card-ink)}
.rc-checks .done[aria-pressed="true"]{background:#1F6B4A;border:1px solid #1F6B4A;color:#fff}
.rc-checks .skip[aria-pressed="true"]{background:#A3392D;border:1px solid #A3392D;color:#fff}
.rc-tag{justify-self:end;font-size:12px;font-weight:700;padding:5px 10px;border-radius:3px;background:var(--sticky);color:#6B5212;transform:rotate(3deg);box-shadow:0 2px 6px -3px rgba(0,0,0,.35)}
.rc-add{justify-self:start;border:1px dashed var(--card-muted);background:transparent;color:var(--card-ink);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600}
.rc-add:hover{border-style:solid}
.cmp-day{display:grid;gap:8px;padding:12px 0 14px;border-bottom:1px dashed var(--paper-line)}
.cmp-day:last-child{border-bottom:0}
.cmp-day>header{display:flex;gap:10px;align-items:center}
.cmp-day>header b{font-family:var(--f-mono);font-size:12.5px;background:var(--card-ink);color:var(--paper);padding:3px 9px;border-radius:3px;transform:rotate(-2deg)}
.cmp-day>header span{font-size:13px;color:var(--card-muted)}
.cmp-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp-col{min-width:0;border:1px dashed var(--paper-line);border-radius:4px;padding:10px;background:rgba(255,255,255,.55)}
.cmp-col.real{border-style:solid;background:#fff;transform:rotate(.4deg);box-shadow:0 6px 14px -12px rgba(20,30,50,.6)}
.cmp-col h4{margin:0 0 8px;font-size:11.5px;letter-spacing:.1em;color:var(--card-muted)}
.cmp-col ul{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.cmp-col li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px;align-items:start;font-size:13.5px;line-height:1.4;color:var(--card-ink);overflow-wrap:anywhere}
.cmp-col.real li{grid-template-columns:minmax(0,1fr)}
.cmp-col small{display:block;font-family:var(--f-pen);font-size:17px;line-height:1.15;color:var(--card-muted)}
.cmp-col em{font-style:normal;font-size:11px;font-weight:700;padding:1px 6px;border-radius:3px;background:var(--sticky);color:#6B5212}
.cmp-col img{display:block;width:100%;max-height:150px;object-fit:cover;border:4px solid #fff;box-shadow:0 4px 10px -6px rgba(20,30,50,.6);transform:rotate(-1deg);margin-top:4px}
.mk{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;font-size:11px;font-style:normal;font-weight:700;margin-top:1px}
.mk.done{background:#1F6B4A;color:#fff}.mk.skip{background:#A3392D;color:#fff}.mk.none{border:1.5px dashed var(--card-muted)}
/* forms used by the schedule and record */
.memo select,.memo input[type=time]{width:100%;font:inherit;background:var(--m-field);color:var(--m-ink);border:1px solid var(--m-line-strong);border-radius:6px;padding:10px 12px;min-height:44px}
.memo select:focus,.memo input[type=time]:focus{outline:none;border-color:var(--m-ink);box-shadow:0 0 0 3px rgba(28,38,57,.12);background:#FFFFFF}
.pk-list{list-style:none;margin:0;padding:2px;display:grid;gap:6px;max-height:min(42vh,340px);overflow:auto}
.pk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px dashed var(--m-line-strong);border-radius:6px;background:var(--m-field);cursor:pointer;color:var(--m-ink)}
.pk:has(input:checked){border:1px solid var(--m-ink);background:#FFFFFF}
.pk input{width:18px;height:18px;margin:0;accent-color:var(--m-ink)}
.pk-t{display:grid;min-width:0}
.pk-t b{font-weight:600;overflow-wrap:anywhere}
.pk-k{font-size:11.5px;color:var(--m-muted)}
.pk small{font-size:11.5px;color:var(--m-muted);white-space:nowrap}
.pk-empty{font-size:13px;color:var(--m-muted);padding:8px 0}
.pm-link button{background:none;border:0;padding:4px 0;font:inherit;font-size:13.5px;font-weight:600;color:var(--m-ink);text-decoration:underline;text-underline-offset:3px}
.pm-plan{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--m-muted);margin:-6px 0 14px}
.pm-plan span{display:inline-flex;gap:4px;align-items:center}
.pm-plan svg{width:11px;height:11px}
.memo .imps .pick-done input:checked + .body{border:1px solid #1F6B4A;background:#1F6B4A;color:#fff;transform:rotate(-1.5deg)}
.memo .imps .pick-skip input:checked + .body{border:1px solid #A3392D;background:#A3392D;color:#fff;transform:rotate(1.5deg)}
.memo .imps .pick-none input:checked + .body{border:1.5px dashed var(--m-ink);background:#FFFFFF;color:var(--m-ink)}
/* friends, likes, comments, room menu extras */
.join-link{margin-top:10px;background:none;border:0;padding:8px 6px;font:inherit;font-size:13.5px;font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.create-view .join-link{align-self:center;margin-top:14px}
.rm-hint{font-size:12px;line-height:1.45;color:var(--card-muted)}
.rmenu .btn.small{justify-content:flex-start;text-align:left}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.linkish{background:none;border:0;padding:2px 0;font:inherit;font-size:13px;font-weight:600;color:var(--m-ink);text-decoration:underline;text-underline-offset:3px}
.linkish.danger{color:var(--m-red)}
.pm-note{font-size:13px;line-height:1.5;color:var(--m-muted)}
.memo .code-in{font-family:var(--f-mono);font-size:20px;letter-spacing:.25em;text-transform:uppercase}
.invite{display:grid;gap:8px;justify-items:start;padding:14px 16px;margin-bottom:18px;background:#FFFFFF;border:1.5px dashed var(--m-line-strong);border-radius:6px;transform:rotate(-.5deg)}
.invite-l{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--m-muted)}
.invite-code{font-family:var(--f-mono);font-size:32px;font-weight:600;letter-spacing:.22em;color:var(--m-ink);line-height:1.1}
.invite-acts{display:flex;flex-wrap:wrap;gap:8px}
.people{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.people li{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 12px;border:1px dashed var(--m-line-strong);border-radius:6px;background:var(--m-field)}
.people .who-n{font-weight:600;color:var(--m-ink);overflow-wrap:anywhere}
.people .tag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--m-ink);color:#FFFDF6}
.people .tag.me{background:transparent;color:var(--m-ink);border:1px solid var(--m-ink)}
.people .linkish{margin-left:auto}
.dv-date b{color:var(--m-ink);font-weight:700}
.dv-social{display:grid;gap:12px;padding-top:12px;border-top:1px dashed var(--m-line-strong)}
.likes{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.like{border:1px solid var(--m-line-strong);background:#FFFFFF;color:var(--m-ink);border-radius:999px;padding:7px 14px;font-weight:700;font-size:13.5px}
.like[aria-pressed="true"]{background:#B4321F;border-color:#B4321F;color:#FFF8F0}
.like-who{font-size:12.5px;color:var(--m-muted);overflow-wrap:anywhere}
.comments{display:grid;gap:8px}
.cm-h{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--m-muted)}
.comments ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.comments li{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;padding:8px 10px;background:#FFFFFF;border-radius:4px;box-shadow:0 1px 0 var(--m-line)}
.comments li b{font-size:13px;color:var(--m-ink)}
.cm-body{flex:1 1 160px;font-size:14px;color:var(--m-ink);overflow-wrap:anywhere;white-space:pre-wrap}
.comments li small{font-size:11.5px;color:var(--m-muted)}
.memo form.cm-form{display:flex;flex-wrap:nowrap;align-items:center;gap:8px}
.memo form.cm-form input{width:auto}
.memo form.cm-form .btn{flex:none;width:auto}
.memo .cm-form input{flex:1;min-width:0;background:var(--m-field);color:var(--m-ink);border:1px solid var(--m-line-strong);border-radius:6px;padding:9px 12px;font:inherit}
.memo .cm-form input:focus{outline:none;border-color:var(--m-ink);background:#fff}
@media (max-width:520px){
  .invite-code{font-size:28px}
  .rc{grid-template-columns:1fr}
  .rc-checks,.rc-tag{justify-self:end;margin-top:-2px}
  .pl-item,.rc-main{grid-template-columns:52px minmax(0,1fr) auto;padding:9px 10px;gap:8px}
  .cmp-cols{gap:6px}
  .cmp-col{padding:8px}
  .cmp-col li{font-size:13px}
}

/* ===================================================================
   Room palette (idea room only): cobalt #0877C9 · warm ivory #F3E4C8 · olive #65702A · tomato #E9433B · bread crust #A65C2B
   ivory = every card and paper surface; cobalt = a few key accents (add button, active tab, chosen filter, tape, focus);
   olive = food / activity labels and "done"; tomato = only the top importance and alerts; crust = paper edges and lines.
   =================================================================== */
body.room-mode{
  --cobalt:#0877C9; --cobalt-deep:#065E9F; --ivory:#F3E4C8; --ivory-deep:#E8D2AA; --olive:#65702A; --olive-ink:#525B20; --tomato:#E9433B; --tomato-ink:#B8302A; --crust:#A65C2B;
  --paper:#F3E4C8; --paper-line:rgba(166,92,43,.24); --sticky:#EFDAB2; --kraft:#DEBD95; --photo-frame:#F8EDD9;
  --card-ink:#1C2639; --card-muted:#5B5446; --tape-a:rgba(8,119,201,.40); --tape-b:rgba(166,92,43,.34); --accent:#0877C9;
}
/* the board itself stays a very light, soft blue with low-contrast dots */
@media (prefers-color-scheme: light){ body.room-mode{ --board:#E7EEF6; --board-dot:#D3DDE9; } }
/* cards: ivory paper with crust-tinted lines; photos are left untouched */
body.room-mode .sc:not(.perf):not(.puzzle) .sc-card{box-shadow:0 1px 1px rgba(166,92,43,.12),0 8px 18px -12px rgba(40,30,20,.45)}
body.room-mode .polaroid .sc-card{background:var(--photo-frame)}
body.room-mode .kraft .sc-card::before{background:var(--board);box-shadow:inset 0 0 0 1.5px var(--crust)}
body.room-mode .sc-kind{color:var(--card-muted)}
body.room-mode .k-food .sc-kind,body.room-mode .k-activity .sc-kind{color:var(--olive-ink)}
/* stamp: ivory paper, crust perforation edge, tomato line under the title (one or two accents per template) */
body.room-mode .perf .sc-card{filter:drop-shadow(0 0 .8px rgba(166,92,43,.75)) drop-shadow(0 1px 1px rgba(40,30,20,.14)) drop-shadow(0 8px 10px rgba(40,30,20,.22))}
body.room-mode .perf .sc-card::before{background:var(--ivory)}
body.room-mode .perf .sc-kind{color:var(--tomato-ink)}
body.room-mode .perf.k-food .sc-kind,body.room-mode .perf.k-activity .sc-kind{color:var(--olive-ink)}
body.room-mode .perf .ph{background:var(--ivory-deep)}

      members:(d.bf_room_members||[]).map(m => ({ uid:m.user_id, role:m.role, nick:m.nickname || (m.role==='owner' ? '방장' : '친구'), joined:ms(m.joined_at) })),
      ideas:(d.bf_ideas||[]).map(ideaFromRow), plans:(d.bf_plans||[]).map(planFromRow), createdAt:ms(d.created_at), updatedAt:ms(d.updated_at) };
  }
  // turn photo paths into short-lived links the browser can show (the photo folder is private)
  const photoLinks = {};   // path -> link, kept so a refresh doesn't ask again
  async function signPhotos(ideas){
    const todo = ideas.filter(i => i.photoPath && !i.photo);
    if(!todo.length) return;
    const { data, error } = await sb.storage.from(BUCKET).createSignedUrls(todo.map(i => i.photoPath), SIGN_FOR);
    if(error || !data) return;
    const byPath = {}; data.forEach(s => { if(s && s.signedUrl) byPath[s.path] = s.signedUrl; });
    Object.assign(photoLinks, byPath);
    todo.forEach(i => { if(byPath[i.photoPath]) i.photo = byPath[i.photoPath]; });
  }
  async function uploadPhoto(roomId, blob){
    const path = roomId + '/' + newId() + '.jpg';
    const { error } = await sb.storage.from(BUCKET).upload(path, blob, { contentType:'image/jpeg', upsert:false });
    if(error) throw error;
    return path;
  }
  // a photo that went up but whose card failed to save shouldn't linger in storage
  function dropUpload(path){ if(path) sb.storage.from(BUCKET).remove([path]).then(()=>{}, ()=>{}); }

  // positions are saved quietly; a burst of key nudges becomes one save
  const posTimers = {};
  function savePos(it, wait){
    clearTimeout(posTimers[it.id]);
    posTimers[it.id] = setTimeout(async () => {
      delete posTimers[it.id];
      const { error } = await sb.from('bf_ideas').update({ x:it.x, y:it.y, z:it.z||1 }).eq('id', it.id);
      if(error) toast('카드 위치를 저장하지 못했어요. 인터넷 연결을 확인해 주세요.');

  }

  function errText(error){
    const m = String((error && (error.message || error.error_description)) || error || '');
    if(typeof navigator!=='undefined' && navigator.onLine===false) return '인터넷 연결이 끊겼어요. 연결되면 다시 해 주세요.';
    if(/photo limit/i.test(m)) return '이 방은 사진을 '+60+'장까지 붙일 수 있어요. 다른 카드의 사진을 빼고 다시 해 주세요.';
    if(/quota|insufficient.?storage|read.?only|storage.*(full|limit exceeded)|exceed.*(quota|storage|limit)|507/i.test(m)) return '서버 저장 공간이 꽉 찼어요. 오래된 방을 이미지로 저장한 뒤 지우면 다시 쓸 수 있어요.';
    if(/paused|service unavailable|upstream|\b503\b|\b502\b|\b504\b/i.test(m)) return '서버가 잠시 쉬고 있어요. 조금 뒤에 다시 해 주세요.';
    if(/jwt expired|invalid jwt|refresh token|not signed in/i.test(m)) return '로그인이 풀렸어요. 새로고침한 뒤 다시 로그인해 주세요.';
    if(/invalid login credentials/i.test(m)) return '이메일이나 비밀번호가 맞지 않아요.';
    if(/already registered|already been registered|already exists/i.test(m)) return '이미 가입한 이메일이에요. 로그인해 주세요.';
    if(/password.*(6|least)/i.test(m)) return '비밀번호는 6자 이상으로 정해 주세요.';
    if(/email.*not.*confirmed/i.test(m)) return '이메일 확인이 아직 안 됐어요. 메일함을 확인해 주세요.';
    if(/invalid.*email|email.*invalid|unable to validate email/i.test(m)) return '이메일 주소가 맞는지 확인해 주세요.';
    if(/rate limit|too many/i.test(m)) return '시도가 너무 많았어요. 잠시 뒤에 다시 해 주세요.';
    if(/fetch|network|failed to|load failed/i.test(m)) return '서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.';
    if(/payload too large|maximum allowed size|object exceeded|file size/i.test(m)) return '사진 파일이 너무 커요. 다른 사진을 골라 주세요.';
    return '잠시 문제가 생겼어요. 다시 해 주세요.';
  }

  function setErr(id, msg){

  // ---------- home: pick a room, or create the first one ----------
  function renderHome(){
    if(!rooms.length){ return renderCreate(true); }

  // viewBox 100 x 140 ~ the pane's shape. Text occupies x 15-85 above y 72 and the centre below y 98.
  // position lives on the outer group; the inner group carries the CSS drift (a CSS transform would replace the attribute)
  const puff = (x,y,k,o,cls) => '<g opacity="'+o+'" transform="translate('+x+' '+y+') scale('+k+')"><g class="'+cls+'">'
    + '<circle cx="0" cy="0" r="5"/><circle cx="7" cy="-3.5" r="7"/><circle cx="15" cy="-1.5" r="5.5"/><circle cx="21" cy="1" r="4"/>'
    + '<rect x="-4" y="0" width="29" height="5" rx="2.5"/></g></g>';
  // one continuous outline per layer. Its baseline follows the window's bottom curve:
  // high at both edges, lowest in the middle (yC = middle height, k = how much higher the edges sit).
  const bank = (yC, k, x0, bumps, o) => {
    const f = x => yC - k * Math.pow((x-50)/50, 2);
    let x = x0, d = 'M'+x0+' 141 L'+x0+' '+f(x0).toFixed(2);
    bumps.forEach(([w,h]) => { const dy = f(x+w) - f(x); d += ' a'+(w/2)+' '+h+' 0 0 1 '+w+' '+dy.toFixed(2); x += w; });
    d += ' L'+x+' 141 Z';
    return '<g opacity="'+o+'"><path d="'+d+'"/></g>';
  };
  const CLOUDS = '<svg class="clouds" viewBox="0 0 100 140" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">'
    + puff(-9, 80, 1.05, .72, 'drift-a')      // left edge, empty middle band
    + puff(77, 87, .95, .62, 'drift-b')       // right edge, a little lower
    // low cloud bank along the bottom, under the count: a faint back row and a brighter front row
    + '</svg>';

  function homeList(){ return rooms.slice().sort((a,b)=> (b.updatedAt||0)-(a.updatedAt||0)); }

  // ---------- carousel: swipe (touch), drag + buttons (desktop), dots ----------
  let car = null;
  let homeRoomId = null; // which window the home carousel shows
  const reduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function setupCarousel(count, start){
    const track = document.getElementById('track');
    const slideEls = Array.from(track.children);
    const step = () => slideEls.length > 1 ? slideEls[1].offsetLeft - slideEls[0].offsetLeft : 1;
    car = { track, count, idx:start };
    track.scrollLeft = step()*start;

    function mark(i){
      if(i===car.idx && track.dataset.ready) return;
      car.idx = i; homeRoomId = slideEls[i].querySelector('.window').dataset.open; track.dataset.ready = '1';
      slideEls.forEach((s,k)=>s.classList.toggle('is-active', k===i));
      root.querySelectorAll('.dot').forEach((d,k)=>{ if(k===i) d.setAttribute('aria-current','true'); else d.removeAttribute('aria-current'); });
    }
    car.go = function(i){
      i = Math.max(0, Math.min(count-1, i));
      track.scrollTo({ left: step()*i, behavior: reduced() ? 'auto' : 'smooth' });
      mark(i);
    };

    let ticking = false;
    track.addEventListener('scroll', () => {
      if(ticking || car.drag) return; ticking = true;
      requestAnimationFrame(() => { ticking = false; mark(Math.round(track.scrollLeft / step())); });
    }, { passive:true });

    track.addEventListener('keydown', e => {
      if(e.key==='ArrowRight'){ e.preventDefault(); car.go(car.idx+1); }
      else if(e.key==='ArrowLeft'){ e.preventDefault(); car.go(car.idx-1); }
    });

    // mouse drag (touch uses native swipe + snap)
    track.addEventListener('pointerdown', e => {
      if(e.pointerType!=='mouse' || e.button!==0) return;
      car.drag = { x:e.clientX, left:track.scrollLeft, moved:false };
    });
    car.step = step;
    mark(start);
  }
  // registered once; they act on whichever carousel is on screen
  window.addEventListener('pointermove', e => {
    if(!car || !car.drag) return;
    const dx = e.clientX - car.drag.x;
    if(!car.drag.moved && Math.abs(dx) > 6){ car.drag.moved = true; car.track.classList.add('dragging'); }
    if(car.drag.moved) car.track.scrollLeft = car.drag.left - dx;
  });
  window.addEventListener('pointerup', e => {
    if(!car || !car.drag) return;
    const d = car.drag; car.drag = null;
    if(!d.moved) return;
    car.track.classList.remove('dragging');
    car.suppressClick = true; setTimeout(()=>{ if(car) car.suppressClick = false; }, 50);
    const dx = e.clientX - d.x, from = Math.round(d.left / car.step());
    car.go(Math.abs(dx) > 50 ? from + (dx < 0 ? 1 : -1) : from);
  });

  // the same paper memo makes a new room (ed = null) or fixes an existing one (ed = the room)

      + '<div class="memo create-memo"><span class="tape memo-tape" aria-hidden="true" style="--tape-tilt:-2deg"></span><div class="modal">'

      +     '<div class="field"><label for="r-name">방 이름 <span class="opt">(선택)</span></label><input type="text" id="r-name" maxlength="40" placeholder="비워 두면 “오사카 여행”처럼 지어져요" autocomplete="off"'+val(ed&&ed.name)+'></div>'

      +       '<label><input type="radio" name="r-type" id="r-group" value="group"'+(group?' checked':'')+'><span class="body"><b>함께</b><small>친구들과 추천 모으기</small></span></label>'
      +     '</div></fieldset>'
      +     '<fieldset class="field"><legend>여행 날짜 <span class="opt">(선택)</span></legend>'
      +       '<div class="row2"><div class="field"><label for="r-start" class="sub">가는 날</label><input type="date" id="r-start"'+val(ed&&ed.start)+'><p class="err" id="e-r-start" hidden></p></div>'
      +       '<div class="field"><label for="r-end" class="sub">오는 날</label><input type="date" id="r-end"'+val(ed&&ed.end)+'><p class="err" id="e-r-end" hidden></p></div></div>'
      +       (ed ? '<p class="hint-s">두 칸을 모두 비우면 ‘날짜 미정’으로 돌아가요.</p>' : '')
      +     '</fieldset>'
      +     '<div class="actions"><div class="right">'+(first?'':'<button type="button" class="btn" data-act="'+cancel+'">취소</button>')+'<button type="submit" class="btn primary">'+(ed ? '저장' : '방 만들기')+'</button></div></div>'
      +   '</form>'
      + '</div></div>'+(first ? '<button type="button" class="join-link" data-act="join">초대받았나요? 초대 코드로 들어가기</button>'+acctLine() : '')+'</div>';
    document.getElementById('room-form').addEventListener('submit', ev => onSaveRoom(ev, ed));

  async function onSaveRoom(ev, ed){
    ev.preventDefault();
    const btn = ev.target.querySelector('button[type=submit]');
    if(btn.disabled) return;
    const dest = document.getElementById('r-dest').value.trim();
    const name = document.getElementById('r-name').value.trim() || (dest ? dest+' 여행' : '');
    const start = document.getElementById('r-start').value;
    const end = document.getElementById('r-end').value;
    const type = document.getElementById('r-group').checked ? 'group' : 'solo';
    const errs = {
      'r-dest': dest ? '' : '여행지를 적어 주세요.',
      'r-start': (!start && end) ? '오는 날을 골랐다면 가는 날도 골라 주세요.' : '',
      'r-end': (start && !end) ? '가는 날을 골랐다면 오는 날도 골라 주세요.' : (start && end && end < start ? '오는 날은 가는 날과 같거나 그 뒤여야 해요.' : '')
    };
    let first = null;
    Object.keys(errs).forEach(k => { setErr(k, errs[k]); if(errs[k] && !first) first = k; });
    if(first){ document.getElementById(first).focus(); return; }

    const row = { dest, name, type, start_date: start || null, end_date: end || null };
    if(ed){
      // nothing changed: just go back
      if(ed.dest===dest && ed.name===name && ed.type===type && ed.start===(start||'') && ed.end===(end||'')){
        view = { name:'room', id:ed.id, tab: view.from || 'ideas', kind:'all' }; render(); return;
      }
      btn.disabled = true; const label = btn.textContent; btn.textContent = '저장 중…';
      const { data, error } = await sb.from('bf_rooms').update(row).eq('id', ed.id).select().single();
      if(error || !data){ btn.disabled = false; btn.textContent = label; toast('방 정보를 고치지 못했어요. '+errText(error)); return; }
      const fresh = roomFromRow(data);
      Object.assign(ed, { dest:fresh.dest, name:fresh.name, type:fresh.type, start:fresh.start, end:fresh.end, updatedAt:fresh.updatedAt });
      view = { name:'room', id:ed.id, tab: view.from || 'ideas', kind:'all' }; render();
      toast('방 정보를 고쳤어요.');
      return;
    }
    btn.disabled = true; const label = btn.textContent; btn.textContent = '만드는 중…';
    const { data, error } = await sb.from('bf_rooms').insert(row).select().single();
    if(error || !data){ btn.disabled = false; btn.textContent = label; toast('방을 만들지 못했어요. '+errText(error)); return; }
    const room = roomFromRow(data);
    if(!room.members.length) room.members = [selfMember()];
    rooms.push(room);
    homeRoomId = room.id;
    view = { name:'room', id:room.id, tab:'ideas', kind:'all' };
    render();
    toast('방을 만들었어요. 첫 아이디어를 담아 보세요.');
  }

  // ---------- room: scrapbook board ----------
  const hash = str => { let h = 7; for(let k=0;k<str.length;k++) h = (h*31 + str.charCodeAt(k)) >>> 0; return h; };
  const TILTS = [-2, 1.4, -0.8, 1.9, -1.5, 0.6, 1.1, -1.2];
  const PIN = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 11.2s3.8-3.6 3.8-6.3A3.8 3.8 0 0 0 2.2 4.9c0 2.7 3.8 6.3 3.8 6.3z" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="6" cy="4.9" r="1.3" fill="currentColor"/></svg>';
  const LINK = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M5 7l2-2M4.2 5.6L3 6.8a1.8 1.8 0 0 0 2.5 2.5l1.2-1.2M7.8 6.4L9 5.2a1.8 1.8 0 0 0-2.5-2.5L5.3 3.9" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>';

  // every card gets a stable look and width from its id, so the board doesn't reshuffle on each visit
  const WIDTHS = { polaroid:210, print:240, stamp:190, paper:215, sticky:190, grid:215, kraft:195, perf:216, puzzle:214 };
  function cardLook(it){
    const h = hash(it.id), tilt = TILTS[h % TILTS.length];
    if(it.template==='stamp') return { tilt, look:'perf', w: WIDTHS.perf, tape:false };
    if(it.template==='puzzle') return { tilt, look:'puzzle', w: WIDTHS.puzzle, tape:false };
    if(it.photo || it.photoPath){
      const look = ['polaroid','print','polaroid'][h % 3];
      return { tilt, look, w: WIDTHS[look], tape: look==='print' || (look==='polaroid' && h%2===0) };
    }
    const look = ['paper','sticky','grid','kraft'][h % 4];
    return { tilt, look, w: WIDTHS[look], tape: look==='paper' || look==='grid' };
  }

  // a jigsaw piece in a 120x120 box: square body with a tab on each side, poking out or in (picked from the card id)
  function piecePathD(id){
    const S = 120, b = 20, th = 17, hv = hash(id + '#piece');
    const C = [[b,b],[S-b,b],[S-b,S-b],[b,S-b]], N = [[0,-1],[1,0],[0,1],[-1,0]];
    let d = 'M'+b+' '+b;
    for(let e = 0; e < 4; e++){
      const [x0,y0] = C[e], [x1,y1] = C[(e+1)%4], [nx,ny] = N[e], s = ((hv >> e) & 1 ? 1 : -1) * th;
      const P = (u,v) => (x0+(x1-x0)*u+nx*v*s).toFixed(1)+' '+(y0+(y1-y0)*u+ny*v*s).toFixed(1);
      d += ' L'+P(.36,0)+' C'+P(.42,0)+' '+P(.43,.25)+' '+P(.39,.45)+' C'+P(.33,.8)+' '+P(.4,1)+' '+P(.5,1)
        +  ' C'+P(.6,1)+' '+P(.67,.8)+' '+P(.61,.45)+' C'+P(.57,.25)+' '+P(.58,0)+' '+P(.64,0)+' L'+P(1,0);
    }
    return d + ' Z';
  }
  const pieceUrl = id => "url('data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><path d="'+piecePathD(id)+'"/></svg>') + "')";

  function cardHtml(it){
    const L = cardLook(it), h = hash(it.id);
    const ratio = Math.min(1.6, Math.max(0.75, it.ratio || 4/3));
    const hasPh = !!(it.photo || it.photoPath), img = it.photo ? '<img src="'+esc(it.photo)+'" alt="" draggable="false">' : '';
    // puzzle: the photo itself is cut into the piece; without a photo the piece is plain paper with the title
    const photo = L.look==='puzzle' ? '<span class="pz" aria-hidden="true"><span class="pz-cut" style="--piece:'+pieceUrl(it.id)+'">'+img+'</span></span>'
      : hasPh ? '<span class="ph" style="--ratio:'+ratio.toFixed(3)+'">'+img+'</span>' : '';
    const body = L.look==='puzzle' && hasPh ? '' : '<div class="sc-body">'
      +   '<p class="sc-kind">'+KINDS[it.kind]+'</p>'
      +   '<h3 class="sc-title">'+esc(it.title)+'</h3>'
      + '</div>';
    const place = it.place ? '<a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(it.place)+'" target="_blank" rel="noopener noreferrer">'+PIN+'<span>'+esc(it.place)+'</span></a>' : '';
    const link = it.link && /^https?:\/\//i.test(it.link) ? '<a href="'+esc(it.link)+'" target="_blank" rel="noopener noreferrer">'+LINK+'<span>'+esc(it.link.replace(/^https?:\/\/(www\.)?/i,'').replace(/\/$/,''))+'</span></a>' : '';
    const dim = view.kind!=='all' && it.kind!==view.kind;
    const placed = typeof it.x === 'number';
    return '<li class="sc '+L.look+' k-'+it.kind+(it.photo || it.photoPath ? ' has-ph' : '')+(dim?' dim':'')+'" data-id="'+it.id+'" style="--w:'+L.w+'px;'+(placed?'left:'+it.x+'px;top:'+it.y+'px;':'visibility:hidden;')+'z-index:'+(it.z||1)+'"'+(dim?' aria-hidden="true"':'')+'>'
      + '<article class="sc-card" style="--tilt:'+L.tilt+'deg">'
      +   (L.tape ? '<span class="tape'+(h%3===0?' b':'')+'" style="--tape-tilt:'+((h%7)-3)+'deg"></span>' : '')
      +   '<span class="sticker '+it.imp+'">'+IMP[it.imp]+'</span>'
      +   '<button type="button" class="sc-hit" data-view="'+it.id+'" aria-label="'+esc(it.title)+', '+IMP[it.imp]+'. 자세히 보기. Alt와 방향키로 옮길 수 있어요"'+(dim?' tabindex="-1"':'')+'></button>'
      +   photo + body
      + '</article></li>';
  }

  function emptyBoard(){
    return '<div class="board is-empty">'
      + '<span class="ghost-frame" style="left:12%;top:24%;width:110px;height:130px;transform:rotate(-6deg)"></span>'
      + '<span class="ghost-frame" style="right:12%;bottom:24%;width:130px;height:96px;transform:rotate(5deg)"></span>'
      + '<div class="first-note"><span class="tape" style="--tape-tilt:-3deg"></span>'
      +   '<h2>첫 아이디어를 붙여 볼까요?</h2>'
      +   '<p>가고 싶은 곳, 먹고 싶은 것, 해 보고 싶은 일을 사진이랑 같이 모아 봐요.</p>'
      +   '<p class="hint">오른쪽 위 ‘아이디어 추가하기’를 누르면 시작돼요.</p>'
      + '</div></div>';
  }

  // ---------- free canvas ----------
  const CV_PAD = 360;                          // spare room to drag into
  const cvTop = () => Math.round(130 / cvScale());   // room under the floating label, in canvas units
  const cvScale = () => Math.min(1, Math.max(0.62, window.innerWidth / 560));
  let canvasRoom = null;                      // the room currently drawn on the canvas
  let pendingScroll = null;                   // keep the view where it was across re-renders

  function sizeCanvas(){
    const sc = document.getElementById('cv-scroll'), sz = document.getElementById('cv-sizer'), cv = document.getElementById('cv');
    if(!sc || !cv) return;
    const s = cvScale();
    let W = sc.clientWidth / s, H = sc.clientHeight / s;
    cv.querySelectorAll('.sc').forEach(li => {
      if(li.style.visibility==='hidden') return;
      W = Math.max(W, li.offsetLeft + li.offsetWidth + CV_PAD);
      H = Math.max(H, li.offsetTop + li.offsetHeight + CV_PAD);
    });
    cv.style.width = W+'px'; cv.style.height = H+'px'; cv.style.transform = 'scale('+s+')';
    sz.style.width = (W*s)+'px'; sz.style.height = (H*s)+'px';
  }

  // ideas that have no spot yet (made before this version) get one, in tidy columns, once
  function placeUnplaced(r){
    const cv = document.getElementById('cv'), sc = document.getElementById('cv-scroll'); if(!cv) return;
    const todo = [...cv.querySelectorAll('.sc')].filter(li => li.style.visibility==='hidden');
    if(!todo.length) return;
    const s = cvScale(), viewW = sc.clientWidth / s, colW = 258;
    const cols = Math.max(1, Math.floor((viewW - 24) / colW));
    const x0 = Math.max(16, (viewW - cols*colW) / 2 + 12);
    // continue below anything already placed
    let floor = cvTop();
    cv.querySelectorAll('.sc').forEach(li => { if(li.style.visibility!=='hidden') floor = Math.max(floor, li.offsetTop + li.offsetHeight + 40); });
    const colY = Array(cols).fill(floor);
    let z = maxZ(r);
    todo.forEach(li => {
      const it = r.ideas.find(i => i.id===li.dataset.id); if(!it) return;
      const c = colY.indexOf(Math.min(...colY)), h = hash(it.id);
      it.x = Math.round(x0 + c*colW + (h%17) - 8); it.y = Math.round(colY[c] + (h%11));
      it.z = ++z;
      li.style.left = it.x+'px'; li.style.top = it.y+'px'; li.style.zIndex = it.z; li.style.visibility = '';
      colY[c] += li.offsetHeight + 34;
      savePos(it);
    });
  }
  const maxZ = r => r.ideas.reduce((m,i)=>Math.max(m, i.z||0), 0);

  // where a new card should land: the open space closest to the middle of what you're looking at
  function freeSpot(){
    const sc = document.getElementById('cv-scroll'), cv = document.getElementById('cv'), s = cvScale();
    const W = 230, H = 280, gap = 18;
    const view = sc ? { l: sc.scrollLeft/s, t: sc.scrollTop/s, w: sc.clientWidth/s, h: sc.clientHeight/s } : { l:0, t:0, w: innerWidth/s, h: innerHeight/s };
    const cx = view.l + view.w/2 - W/2, cy = Math.max(cvTop(), view.t + view.h/2 - H/2);
    const boxes = cv ? [...cv.querySelectorAll('.sc')].map(li => ({ l: li.offsetLeft-gap, t: li.offsetTop-gap, r: li.offsetLeft+li.offsetWidth+gap, b: li.offsetTop+li.offsetHeight+gap })) : [];
    const free = (x,y) => x >= 12 && y >= cvTop() && !boxes.some(b => x < b.r && x+W > b.l && y < b.b && y+H > b.t);
    for(let ring = 0; ring <= 14; ring++){
      const pts = ring===0 ? [[0,0]] : [];
      for(let k=0; ring && k<8*ring; k++){ const a = k/(8*ring)*Math.PI*2; pts.push([Math.cos(a)*ring*70, Math.sin(a)*ring*60]); }
      for(const [dx,dy] of pts){ const x = Math.round(cx+dx), y = Math.round(cy+dy); if(free(x,y)) return { x, y }; }
    }
    // board is full around here: put it just below everything
    const bottom = boxes.reduce((m,b)=>Math.max(m,b.b), cvTop());
    return { x: Math.max(16, Math.round(cx)), y: Math.round(bottom + gap) };
  }

  function mountCanvas(r){
    const sc = document.getElementById('cv-scroll'); if(!sc) return;
    canvasRoom = r;
    const cv = document.getElementById('cv');
    if(cv){
      cv.style.transform = 'scale('+cvScale()+')';
      placeUnplaced(r); sizeCanvas();
      cv.querySelectorAll('img').forEach(img => { if(!img.complete) img.addEventListener('load', sizeCanvas, { once:true }); });
      if(document.fonts && document.fonts.ready) document.fonts.ready.then(sizeCanvas);
      cv.addEventListener('pointerdown', onCardDown);
      cv.addEventListener('contextmenu', e => { if(e.target.closest('.sc')) e.preventDefault(); });
      cv.addEventListener('touchmove', e => { if(drag && drag.active) e.preventDefault(); }, { passive:false });
      cv.addEventListener('keydown', onCardKey);
    }
    if(pendingScroll){ sc.scrollLeft = pendingScroll.left; sc.scrollTop = pendingScroll.top; pendingScroll = null; }
  }
  window.addEventListener('resize', () => { if(document.getElementById('cv')) sizeCanvas(); });

  // ---------- dragging: mouse drags right away, touch drags after a long press ----------
  let drag = null, suppressClickUntil = 0;
  function onCardDown(e){
    const li = e.target.closest('.sc'); if(!li || (e.button!==undefined && e.button>0)) return;
    if(e.target.closest('a')) return;
    const sc = document.getElementById('cv-scroll');
    drag = { li, id: li.dataset.id, pid: e.pointerId, sx: e.clientX, sy: e.clientY, x0: li.offsetLeft, y0: li.offsetTop,
             sl: sc.scrollLeft, st: sc.scrollTop, active: false, touch: e.pointerType!=='mouse', timer: null, lx: e.clientX, ly: e.clientY };
    if(drag.touch) drag.timer = setTimeout(() => { if(drag && !drag.active) startDrag(); }, 380);
  }
  function startDrag(){
    drag.active = true;
    const r = canvasRoom; drag.li.style.zIndex = (r ? maxZ(r) : 0) + 1;
    drag.li.classList.add('dragging');
    try{ drag.li.setPointerCapture(drag.pid); }catch(_){}
    if(navigator.vibrate) try{ navigator.vibrate(12); }catch(_){}
  }
  function dragTo(clientX, clientY){
    const sc = document.getElementById('cv-scroll'), s = cvScale();
    const x = Math.max(0, Math.round(drag.x0 + (clientX - drag.sx + sc.scrollLeft - drag.sl) / s));
    const y = Math.max(0, Math.round(drag.y0 + (clientY - drag.sy + sc.scrollTop - drag.st) / s));
    drag.li.style.left = x+'px'; drag.li.style.top = y+'px';
    // grow the board while dragging toward its far edges
    const cv = document.getElementById('cv');
    if(x + drag.li.offsetWidth + 120 > parseFloat(cv.style.width) || y + drag.li.offsetHeight + 120 > parseFloat(cv.style.height)) sizeCanvas();
  }
  let edgeTimer = null;
  function edgeScroll(){
    if(!drag || !drag.active){ edgeTimer = null; return; }
    const sc = document.getElementById('cv-scroll'), m = 56; let dx = 0, dy = 0;
    if(drag.lx < m) dx = -14; else if(drag.lx > innerWidth - m) dx = 14;
    if(drag.ly < m) dy = -14; else if(drag.ly > innerHeight - m) dy = 14;
    if(dx || dy){ sc.scrollLeft += dx; sc.scrollTop += dy; dragTo(drag.lx, drag.ly); }
    edgeTimer = requestAnimationFrame(edgeScroll);
  }
  window.addEventListener('pointermove', e => {
    if(!drag || e.pointerId!==drag.pid) return;
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if(!drag.active){
      if(drag.touch){ if(Math.hypot(dx,dy) > 9){ clearTimeout(drag.timer); drag = null; } return; } // finger moved first: it's a scroll
      if(Math.hypot(dx,dy) < 4) return;
      startDrag();
    }
    e.preventDefault();
    drag.lx = e.clientX; drag.ly = e.clientY;
    dragTo(e.clientX, e.clientY);
    if(!edgeTimer) edgeTimer = requestAnimationFrame(edgeScroll);
  }, { passive:false });
  function endDrag(){
    if(!drag) return;
    clearTimeout(drag.timer);
    const d = drag; drag = null;
    if(!d.active) return;
    d.li.classList.remove('dragging');
    suppressClickUntil = Date.now() + 350;
    const r = canvasRoom, it = r && r.ideas.find(i => i.id===d.id);
    if(it){ it.x = d.li.offsetLeft; it.y = d.li.offsetTop; it.z = parseInt(d.li.style.zIndex,10) || 1; savePos(it); }
    sizeCanvas();
  }
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);

  // keyboard: Alt + arrow keys nudge the focused card
  function onCardKey(e){
    if(!e.altKey || !/^Arrow/.test(e.key)) return;
    const li = e.target.closest('.sc'), r = canvasRoom; if(!li || !r) return;
    const it = r.ideas.find(i => i.id===li.dataset.id); if(!it) return;
    e.preventDefault();
    const step = e.shiftKey ? 60 : 20;
    if(e.key==='ArrowLeft') it.x = Math.max(0, it.x - step);
    if(e.key==='ArrowRight') it.x += step;
    if(e.key==='ArrowUp') it.y = Math.max(0, it.y - step);
    if(e.key==='ArrowDown') it.y += step;
    li.style.left = it.x+'px'; li.style.top = it.y+'px'; savePos(it, 600); sizeCanvas();
  }

  function renderRoom(){
    const r = rooms.find(x => x.id===view.id);
    if(!r){ view = { name:'home' }; return render(); }
    const st = status(r), d = dday(r);
    let body = '';

    if(view.tab==='ideas'){
      body = r.ideas.length
        ? '<div class="cv-sizer" id="cv-sizer"><ul class="cv" id="cv">'+r.ideas.slice().sort((a,b)=> IMP_RANK[a.imp]-IMP_RANK[b.imp] || b.createdAt-a.createdAt).map(cardHtml).join('')+'</ul></div>'
        : emptyBoard();
    } else {
      const panel = view.tab==='plan' ? planPanel(r) : recordPanel(r);
      body = '<div class="sheet-wrap"><div class="sheet wide" role="tabpanel" aria-labelledby="tab-'+view.tab+'">'+panel+'</div></div>';
    }

    const counts = { all:r.ideas.length }; Object.keys(KINDS).forEach(k=>counts[k]=0); r.ideas.forEach(i=>counts[i.kind]++);
    const ROT = { all:-6, place:4, food:-3, activity:7, etc:-5 };
    const stickers = (view.tab==='ideas' && r.ideas.length)
      ? '<div class="prop kstick" role="group" aria-label="종류로 거르기">'
        + [['all','전체']].concat(Object.keys(KINDS).map(k=>[k,KINDS[k]])).map(([k,l]) =>
            '<button type="button" class="kst" data-kind="'+k+'" aria-pressed="'+(view.kind===k)+'" style="--r:'+ROT[k]+'deg"'+(k!=='all'&&!counts[k]?' disabled':'')+'>'+l+(k!=='all'&&counts[k]?'<span class="n">'+counts[k]+'</span>':'')+'</button>').join('')
        + '</div>' : '';

    const menu = !view.menu ? '' : view.confirmRoom

        + (r.ideas.length ? '<p class="rm-hint">지우기 전에 게시판을 이미지로 저장해 두면 추억은 남아요.</p>'+mi('먼저 이미지로 저장','export') : '')
        + '<div class="row"><button type="button" class="btn small" data-act="keep-room">취소</button><button type="button" class="btn small danger" data-act="del-room">삭제</button></div></div>'
      : view.confirmLeave

      : '<div class="rmenu">'
        + mi('함께하는 사람'+((r.members||[]).length > 1 ? ' '+r.members.length+'명' : ''), 'people')
        + mi('이미지로 저장', 'export') + mi('못 간 후보 다른 방에 담기', 'carry')
        + (own ? mi('방 정보 고치기', 'edit-room') + (status(r)==='done' ? '<p class="rm-hint">여행이 끝난 방이에요. 이미지로 저장한 뒤 지우면 서버 공간을 아낄 수 있어요.</p>' : '') + mi('이 방 삭제', 'ask-room', 'ghost-danger')
               : mi('방 나가기', 'ask-leave', 'ghost-danger'))
        + '</div>';

    const tabs = [['ideas','아이디어', r.ideas.length],['plan','일정', plansReady ? r.plans.filter(p => !p.spont).length : undefined],['record','여행 기록']];
    root.innerHTML = '<div class="view room-view">'
      + '<div class="cv-scroll" id="cv-scroll">'+body+'</div>'

      +   '<button type="button" class="rl-back" data-act="home" aria-label="방 목록으로">←</button>'
      +   '<div class="rl-text"><h1>'+esc(r.dest)+'</h1>'
      +   '<p class="rl-sub"><i style="--dot:var(--dot-'+st+')"></i>'+STATUS[st]+(d?' · '+d:'')+' · '+(r.type==='group'?'함께':'혼자')+'<span class="rl-more-info"><br>'+esc(r.name)+' · '+whenText(r)+'</span></p></div>'
      +   '<div class="rl-menu-wrap"><button type="button" class="rl-more" data-act="room-menu" aria-label="방 메뉴" aria-expanded="'+(!!view.menu)+'">⋯</button>'+menu+'</div>'
      + '</header>'
      + '<div class="prop rtools"><button type="button" class="btn add-idea" data-act="add-idea">+ 아이디어 추가하기</button></div>'
      + '<nav class="prop itabs" role="tablist" aria-label="방 메뉴">'
      +   tabs.map(([k,l,n]) => '<button type="button" class="itab t-'+k+'" role="tab" id="tab-'+k+'" aria-selected="'+(view.tab===k)+'" data-tab="'+k+'">'+l+(n!==undefined?'<span class="n">'+n+'</span>':'')+'</button>').join('')
      + '</nav>'
